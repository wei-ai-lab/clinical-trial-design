  notes: |
    **Canonical methodology paper for binding futility in group-
    sequential designs.** Introduces the "two-sided" inner-outer
    boundary framework where the inner (futility) and outer
    (efficacy) boundaries are both pre-specified and binding — i.e.,
    crossing either terminates the trial.

    **Key elements**:
    - Power-family boundaries indexed by Δ ∈ [-0.5, 0.5]; Δ = 0.25
      approximates Pocock, Δ = -0.5 approximates O'Brien-Fleming.
    - Inner (futility) boundary mirrors efficacy boundary in sign
      symmetry; when z-statistic falls below inner at any look,
      stop for futility.
    - **Binding** assumption: the calculation of α-spending assumes
      that if the futility boundary is crossed, the trial stops.
      If the DSMB overrides, type-I error is preserved below nominal
      (conservative) but power is compromised.
    - Separate power and α-spending functions jointly determine the
      N required for given α, β.

    This paper — together with Jennison-Turnbull (2000 textbook) —
    established the theoretical framework for modern GS trials with
    planned futility. Implemented in `rpact::getDesignGroupSequential`
    (argument `futilityBounds`), `gsDesign::gsDesign` (sfupper /
    sflower arguments), and `ldbounds`.

r_packages:
