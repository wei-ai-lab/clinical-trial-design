caveats: |
  **Binding futility is rarely used in practice** despite theoretical
  elegance. Reasons:
  (1) DSMBs typically retain discretion to override futility
      recommendations; binding futility constraints that discretion
      and is considered overly rigid.
  (2) Non-binding futility (Snapinn 2006, Chen et al. 2018) preserves
      type-I error even if DSMB overrides, at a small power cost.
  (3) Most Phase 3 protocols specify **non-binding** futility
      boundaries that serve as DSMB guidance rather than automatic
      stopping rules.

  However, Pampallona-Tsiatis remains the theoretical reference for
  what an optimal (most powerful) binding futility boundary looks
  like under given α, β. Modern practice: design with Pampallona-
  Tsiatis binding boundary as efficiency benchmark, then loosen to
  non-binding for practical DSMB governance. The N difference is
  typically 2-5% between binding and non-binding designs — small
  enough that non-binding wins on operational grounds.
