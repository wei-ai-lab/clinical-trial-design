id: 2011_Rosenblum-vanderLaan_adaptive-enrichment
family: adaptive-enrichment
source:
  kind: methodology-paper
  citation: "Rosenblum M, van der Laan MJ. Optimizing randomized trial designs to distinguish which subpopulations benefit from treatment. Biometrika. 2011;98(4):845-860. Companion: Rosenblum M, Qian T, Du Y, Qiu H, Fisher A. Multiple testing procedures for adaptive enrichment designs: barely valid, exactly valid, and approximately valid. Biostatistics. 2016;17(4):732-746."

design:
  indication: "Generic methodology applicable to any Phase 3 trial with pre-specified subgroup of interest for potential enrichment"
  population: "Any disease with candidate predictive biomarker defining a marker-positive subgroup embedded within overall population"
  arms:
    - name: "experimental treatment"
      allocation: 1
    - name: "control"
      allocation: 1
  endpoint:
    type: any
    description: "Continuous, binary, or time-to-event — methodology applies broadly"
    measurement_time: "per protocol at each stage"
  comparison: superiority
  sidedness: 1
  alpha: 0.025
  power: 0.80
  effect:
    scale: methodology
    adaptive_enrichment_framework: |
      Rosenblum-van der Laan (2011) presented an adaptive enrichment
      design framework with PROSPECTIVE type I error control under
      arbitrary adaptive enrollment rules.

      **Two-stage structure**:

      Stage 1: enroll ALL comers (both marker+ and marker-).
        Estimate treatment effect Δ̂+ in marker+ and Δ̂- in marker-.

      Interim decision rule (pre-specified) — choose ONE:
        a) Continue enrolling ALL (if both subgroups show benefit).
        b) ENRICH to marker+ only (if Δ̂+ large, Δ̂- small).
        c) Stop for futility (if both subgroups show no benefit).

      Stage 2: enroll per decision rule, continue to final analysis.

      Final hypothesis testing addresses:
        H_0^overall: Δ_overall ≤ 0
        H_0^positive: Δ_+ ≤ 0

      Multiple testing procedures (MTP) control family-wise error rate
      (FWER) at α across both hypotheses.
    key_contribution: |
      **Prospective α control via pre-specified decision rules**:
      - Unlike post-hoc subgroup analysis, α is protected by design.
      - Any adaptation function F(Δ̂+, Δ̂-) specifying stage-2 enrollment
        is allowed, provided it is pre-specified.
      - Critical values computed via multivariate normal distribution
        accounting for adaptive enrollment.

      **Three MTP families (Rosenblum et al. 2016)**:
      1. **Barely valid**: simplest, uses Bonferroni split.
         - FWER = α strictly.
         - Conservative.
      2. **Exactly valid**: numerically computed critical values.
         - FWER = α exactly.
         - More powerful than Bonferroni.
      3. **Approximately valid**: asymptotic normal approximations.
         - FWER ≈ α (simulation-verified).
         - Most powerful but requires careful simulation.
    weighted_p_value_combination: |
      At final analysis, stage-1 and stage-2 p-values combined via
      pre-specified weights:
        p_combined = w_1 · z_1 + w_2 · z_2   on z-scale

      Weights can be pre-specified based on:
      - Equal (w_1 = w_2 = 1/√2).
      - Information-based (w_k ∝ √n_k).
      - Decision-dependent (different if enriched vs all-comer).

      Weighted inverse-normal combination preserves α under any
      pre-specified adaptive rule (Cui-Hung-Wang principle).
    advantages_over_fixed_enrichment: |
      - Hedges against biomarker uncertainty: enrolls all initially,
        enriches only if data supports it.
      - Preserves option to claim overall population benefit.
      - Protects α prospectively — no post-hoc inflation.
      - More efficient than always-all-comer if marker-negative
        benefit is minimal.
    numerical_example: |
      HER2+ breast cancer with uncertain marker-negative benefit:
      - γ = 0.25 HER2+ prevalence.
      - Stage 1: 200 patients (50 HER2+, 150 HER2-).
      - Interim decision rule:
          IF Δ̂+ > 0.3 AND Δ̂- < 0.1: ENRICH to HER2+ only.
          IF Δ̂+ > 0.3 AND Δ̂- > 0.1: continue ALL-COMER.
          IF Δ̂+ < 0.1: futility stop.
      - Stage 2: 400 patients per chosen cohort.

      MTP partitions α across:
        H_0^positive: Δ_+ ≤ 0 (always tested)
        H_0^overall: Δ_overall ≤ 0 (tested only if all-comer continued)

      Exactly-valid MTP preserves overall FWER = 0.025 despite
      adaptation.
  comparison_to_other_methods: |
    **Vs Wang-O'Neill-Hung (2007, in corpus)**:
    - WOH focused on specific decision rules (rules 1-3).
    - Rosenblum-vdL allows arbitrary pre-specified decision function.

    **Vs Jenkins-Stone-Jennison (2011, in corpus)**:
    - JSJ used combination tests with group-sequential boundaries.
    - Rosenblum-vdL uses multiple testing procedures directly.
    - Both control FWER; approaches complement.

    **Vs Magnusson-Turnbull (2013, in corpus)**:
    - MT derived OPTIMAL enrichment decision rules (minimize expected N).
    - Rosenblum-vdL shows any rule is valid; doesn't optimize.

    **Vs Brannath-Mehta (2009, in corpus)**:
    - BM used Fisher combination + two hypotheses.
    - Rosenblum-vdL generalizes combination approach.
  accrual:
    duration_months: null
  followup:
    planned_months: null

expected:
  sample_size_total: null
  events_total: null
  tolerance:
    sample_size_pct: 2
  notes: |
    **Rosenblum-van der Laan 2011** provided a rigorous framework for
    adaptive enrichment designs with PROSPECTIVE type I error control
    under **arbitrary** pre-specified decision rules — an important
    generalization beyond specific methods like Wang-O'Neill-Hung.

    **Core contributions**:
    - Any F(Δ̂+, Δ̂-) stage-1 decision rule is allowed.
    - Stage-2 critical values computed via multivariate normal
      distribution accounting for selection.
    - Three MTP families: barely valid (Bonferroni), exactly valid
      (numerical), approximately valid (asymptotic).
    - Weighted combination of stage-1 and stage-2 p-values via
      Cui-Hung-Wang principle.

    **Why this matters**:
    - Fixed enrichment (Simon-Maitournam) requires committing a
      priori to targeted vs untargeted.
    - Adaptive enrichment (Rosenblum-vdL) defers commitment to
      interim — hedges biomarker uncertainty.
    - α is controlled prospectively — regulatory acceptable.

    **R implementation**: `rpact` supports some enrichment designs.
    Custom simulation typically required for optimal MTP selection.

r_packages:
  - rpact (some adaptive enrichment support)
  - AdaptiveDesign
  - adaptTest
  - AGSDest
  - Custom simulation for exact MTPs

