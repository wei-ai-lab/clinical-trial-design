caveats: |
  Rosenblum-van der Laan framework considerations:

  - **Decision rule must be pre-specified**: any interim rule F(Δ̂+, Δ̂-)
    is allowed but MUST be locked in the protocol. Post-hoc
    modification invalidates α control.
  - **MTP selection trade-off**: barely valid is simplest but
    conservative (loses power). Exactly valid requires careful
    numerical computation. Approximately valid requires extensive
    simulation — can yield modest α inflation if asymptotics poor.
  - **Weighted combination**: weights (w_1, w_2) must be pre-specified.
    Common choices: equal (w_k = 1/√2), information-based (∝ √n_k),
    or decision-dependent.
  - **Information-fraction calibration**: for TTE, stage 1 information
    = events at interim; for continuous, information = n.
  - **Interim timing**: typically stage-1 enrolls ~ 30-50% of planned
    N, sufficient for reliable subgroup estimation.

  **Comparison of MTP families**:
  | MTP | α control | Power | Complexity |
  |---|---|---|---|
  | Barely valid (Bonferroni) | Strictly ≤ α | Lowest | Trivial |
  | Exactly valid | = α exactly | Highest | Numerical |
  | Approximately valid | ≈ α | ~ Exactly | Simulation-required |

  **Implementation outline**:
  ```r
  # Conceptual workflow (requires custom code):

  # Stage 1
  n1 <- 200                       # stage-1 sample size
  # Enroll all comers, observe Δ̂+ and Δ̂-

  # Pre-specified decision rule
  enrichment_decision <- function(delta_plus, delta_minus) {
    if (delta_plus > 0.3 & delta_minus < 0.1) return("enrich")
    if (delta_plus > 0.3 & delta_minus >= 0.1) return("all_comer")
    if (delta_plus < 0.1) return("futility")
    return("all_comer")           # default
  }

  # Compute stage-2 critical values via multivariate normal
  # (requires numerical integration accounting for selection)

  # Weighted combination at final analysis
  p_combined <- pnorm(
    w1 * qnorm(1 - p_stage1) + w2 * qnorm(1 - p_stage2),
    lower.tail = FALSE
  )

  # Compare to exactly-valid critical value (not 0.025 Bonferroni)
  ```

  **Relationship to other adaptive enrichment cases**:
  - **Simon-Maitournam 2004** (in corpus): fixed enrichment foundation.
  - **Freidlin-Simon 2005** (in corpus): adaptive signature.
  - **Wang-O'Neill-Hung 2007** (in corpus): specific decision rules.
  - **Brannath-Mehta 2009** (in corpus): combination tests.
  - **Jenkins-Stone-Jennison 2011** (in corpus): two-stage GS boundaries.
  - **Rosenblum-vdL 2011 (this case)**: arbitrary decision rules + MTPs.
  - **Magnusson-Turnbull 2013** (in corpus): optimal decision rules.

  **Historical context**:
  - **Follmann 1997**: early combination-test enrichment.
  - **Bauer-Kohne 1994**: conditional error function (foundation).
  - **Müller-Schäfer 2001**: α-adaptive extension.
  - **Cui-Hung-Wang 1999**: weighted-combination principle.
  - **Rosenblum-vdL 2011** (this case): unified MTP framework.
  - **Rosenblum et al. 2016**: tutorial + three MTP families.

  **Regulatory acceptance**:
  - **FDA 2019 Adaptive Designs Guidance**: adaptive enrichment
    explicitly addressed, prospective α control required.
  - **EMA 2007 CHMP Reflection Paper**: adaptive designs with
    pre-specified rules accepted.
  - **Challenge**: exactly-valid MTPs require numerical methods FDA
    reviewers must verify — extensive simulation documentation
    typically needed.

  **Practical sample-size considerations**:
  - Stage-1 n should be ~ 30-50% of planned N for reliable
    subgroup estimation.
  - Futility boundary helpful to cap trials with no signal.
  - Weighted combination information-based (w_k ∝ √n_k) usually
    near-optimal.
