caveats: |
  Freidlin-Simon adaptive signature design is foundational but rarely
  used in its pure form today. Later refinements addressed key issues:
  (1) Biomarker-adaptive threshold design (Jiang-Freidlin-Simon 2007,
      JNCI) — same concept but for a continuous biomarker where the
      threshold is learned from data.
  (2) Brannath-Mehta 2009 (Biom J) — formalized the framework with
      combination tests for the adaptive component.
  (3) Jenkins-Stone-Jennison 2011 (SIM) — extended to seamless
      Phase 2/3 with both adaptation decisions and alpha allocation.
  (4) Rosenblum-van der Laan 2011 (JASA) — optimality properties
      for fixed-threshold enrichment.

  FDA rarely approves registrational submissions based on a signature
  discovered de novo during the pivotal trial — companies and
  regulators prefer signatures established in Phase 2 or prior
  evidence. However, Freidlin-Simon remains the conceptual basis for
  prospectively-specified biomarker-enrichment strategies in Phase
  3, and directly informs the FDA 2019 adaptive designs guidance
  enrichment section.
