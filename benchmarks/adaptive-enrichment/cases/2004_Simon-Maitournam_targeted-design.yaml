caveats: |
  Simon-Maitournam targeted design considerations:

  - **Biomarker validity assumption**: assumes the biomarker genuinely
    predicts treatment effect (not prognostic only). If biomarker is
    prognostic but not predictive, targeted design may be worse than
    untargeted.
  - **Assay availability / cost**: targeted design requires upfront
    assay. If assay is expensive or slow, screen burden dominates total
    cost. Next-gen sequencing (~ $500/sample) vs IHC (~ $20/sample)
    makes big difference.
  - **Marker prevalence (γ)**: lower γ → higher screen burden but
    cleaner signal. Optimal sweet spot: γ ≈ 0.2-0.5.
  - **Generalizability loss**: targeted trial answers question only
    about marker-positive. Regulatory label may be restricted.
  - **Marker-negative subgroup**: if Δ- > 0 (some benefit in marker-
    negative), targeted design forfeits that patient population.

  **Efficiency table (simple illustration, α = 0.025, 90% power)**:
  | γ | Δ- / Δ+ | Untargeted n / Targeted n |
  |---|---|---|
  | 0.1 | 0.0 | 10 (targeted dominates) |
  | 0.1 | 0.5 | 2 (targeted wins) |
  | 0.1 | 1.0 | 0.5 (untargeted wins) |
  | 0.3 | 0.0 | 11 (targeted dominates) |
  | 0.3 | 0.5 | 2.8 (targeted wins) |
  | 0.3 | 1.0 | 1 (tied) |
  | 0.5 | 0.0 | 4 (targeted dominates) |
  | 0.5 | 0.5 | 1.8 |
  | 0.5 | 1.0 | 1 |

  **R implementation example (sample-size comparison)**:
  ```r
  library(gsDesign)

  # Scenario: TTE endpoint, prevalence γ = 0.25, Δ+ = HR 0.67, Δ- = HR 1.0
  gamma <- 0.25
  hr_pos <- 0.67                # marker-positive HR
  hr_neg <- 1.00                # marker-negative HR

  # Untargeted (pooled) log HR
  log_hr_pooled <- gamma * log(hr_pos) + (1 - gamma) * log(hr_neg)

  # Events needed for untargeted
  events_untargeted <- nEvents(
    hr = exp(log_hr_pooled),
    alpha = 0.025, beta = 0.10, sided = 1
  )

  # Events needed for targeted (HER2+ only)
  events_targeted <- nEvents(
    hr = hr_pos,
    alpha = 0.025, beta = 0.10, sided = 1
  )

  # Randomized sample size depends on event rate × accrual
  # Screen sample size for targeted = randomized / γ
  ```

  **Historical context**:
  - **Simon-Maitournam 2004** (this paper): efficiency comparison.
  - **Maitournam-Simon 2005**: companion full proofs.
  - **Sargent et al. 2005**: clinical trial designs for
    predictive marker validation.
  - **Freidlin-Simon 2005** (in corpus): adaptive signature design.
  - **Simon 2008**: "Biomarker-based clinical trial designs"
    (J Clin Oncol review).
  - **Simon 2012**: "Clinical trials for predictive medicine"
    (Stat Med overview).

  **Modern applications**:
  - **HER2+ breast cancer**: trastuzumab, pertuzumab, T-DM1, T-DXd.
  - **EGFR-mutant NSCLC**: gefitinib, erlotinib, osimertinib.
  - **BRAF V600E melanoma**: vemurafenib, dabrafenib.
  - **MSI-H solid tumors**: pembrolizumab (KEYNOTE-164 / 158).
  - **BRCA1/2 germline**: olaparib, talazoparib, niraparib.
  - **PD-L1 ≥ 50%**: pembrolizumab first-line NSCLC (KEYNOTE-024).
  - **FGFR alterations**: erdafitinib (urothelial).

  All implement Simon-Maitournam targeted design logic.
