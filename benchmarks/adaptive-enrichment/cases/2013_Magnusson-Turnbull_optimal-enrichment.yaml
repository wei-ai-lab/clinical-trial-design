  notes: |
    **Magnusson-Turnbull 2013 (Statistics in Medicine)** is the
    canonical modern reference for **optimal group-sequential
    adaptive enrichment designs**.

    **Core framework**:
    - Two populations: Full (F) and biomarker-defined Subset (S).
    - Two hypotheses: H_F (effect in F) and H_S (effect in S).
    - At each interim analysis, the trial may:
      (1) Continue as is (enroll both F and S).
      (2) Enrich — enroll only S going forward.
      (3) Stop for efficacy (reject H_F or H_S).
      (4) Stop for futility.

    **Statistical machinery**:
    - Group-sequential testing with a spending function on each
      hypothesis family.
    - Closed testing ensures FWER control across H_F and H_S.
    - Selection rule at interim is formalized: pick the action that
      maximizes conditional power or minimizes expected N under the
      design's preferred configuration.

    **Optimality**:
    - Magnusson-Turnbull optimize across a 'configuration set' of
      possible true effects — e.g., equal effect in F and S, effect
      only in S, null.
    - Designs minimize maximum expected N across configurations,
      subject to α- and power-control constraints.
    - Yields stopping boundaries and enrichment thresholds that are
      provably optimal under the configuration set.

    **Why this matters**:
    - Adds *formal optimality* criteria to biomarker enrichment —
      prior work (Freidlin-Simon, Brannath-Mehta, Jenkins-Stone)
      gave valid designs but not optimal ones.
    - Shows that the 'enrichment cost' in terms of sample size is
      relatively modest if done with good rules.
    - Informed the FDA 2019 Adaptive Designs guidance section on
      biomarker enrichment.

    **Parameters of a Magnusson-Turnbull design**:
    - Number of analyses (K), typically 3-4 with one interim
      enrichment decision point.
    - Prevalence of S in F (π) — critical parameter.
    - Effect assumptions in F and S.
    - Weights on configurations for optimization.

r_packages:
  - asd (Parsons-Friede adaptive seamless designs)
  - adaptTest (Vandemeulebroecke)
  - rpact (group-sequential with closed testing)
  - gsDesign (group-sequential core)
  - mvtnorm (closed-testing FWER)

