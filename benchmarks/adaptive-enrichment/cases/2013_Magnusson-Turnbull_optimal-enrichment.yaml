caveats: |
  Magnusson-Turnbull 2013 remains the canonical reference for optimal
  group-sequential enrichment designs, but practical implementation
  requires custom simulation code — no R package implements the full
  optimization framework. The asd package covers the structural
  elements (2-stage combination tests with selection) and rpact
  covers the group-sequential machinery, but joining them into a
  Magnusson-Turnbull optimal design requires integration.

  Extensions to this framework:
  - Stallard-Todd 2003 for treatment selection (not enrichment, but
    related methodology).
  - Friede-Parsons-Stallard 2011 for combined dose-and-enrichment
    adaptive seamless designs.
  - Rosenblum-van der Laan 2011 for fixed-threshold optimal
    enrichment.

  Regulatory context: FDA has accepted Magnusson-Turnbull-style
  designs for registrational trials when the biomarker and threshold
  are pre-specified and clinically justified (not data-driven
  post-hoc). The TAPPAS trial (2019, in corpus) is a close real
  implementation.
