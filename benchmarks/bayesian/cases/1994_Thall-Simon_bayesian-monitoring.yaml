  effect:
    methodology: "Bayesian continuous / frequent interim monitoring with posterior probability stopping rules"
    prior: "Conjugate beta prior for binary endpoint; often informative (based on historical response rates)"
    stopping_rules: |
      Continuous stopping based on posterior probabilities:
      - Futility: P(p > p0 | data) < δ_fut (e.g., < 0.05)
      - Superiority: P(p > p0 | data) > δ_sup (e.g., > 0.95)
      where p0 is the target response rate (null).
    type_i_calibration: "Frequentist OC calibrated via simulation — choose thresholds to achieve desired α and power under specified scenarios"
    key_advantage: "Continuous monitoring without α-penalty scaling (unlike frequentist GS with spending functions)"
