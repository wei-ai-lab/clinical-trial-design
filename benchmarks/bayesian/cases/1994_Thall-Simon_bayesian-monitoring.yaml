caveats: |
  Thall-Simon Bayesian monitoring is the canonical Phase 2 framework
  but has key practical considerations:

  - **Prior elicitation**: sceptical, enthusiastic, or reference
    priors based on historical data. Sensitivity analysis essential.
  - **Stopping threshold calibration**: simulation under H0 and H1
    to tune δ_fut and δ_sup to achieve target type I and power.
  - **Type I vs type II trade-off**: continuous monitoring without
    α-adjustment comes at cost of operational complexity.
  - **Reporting**: frequentist OC characteristics usually reported
    alongside Bayesian stopping rules (hybrid reporting).

  Extensions and modern variants:
  - **Predictive probability (Lee-Liu 2008)**: P(success at final |
    current data); more intuitive than posterior.
  - **Hybrid Bayesian/frequentist**: Bayesian monitoring with
    frequentist final hypothesis test.
  - **RBesT / robust MAP** (Schmidli 2014, in corpus): prior
    construction from historical data.
  - **Bayesian adaptive randomization** (Thall-Wathen 2007):
    randomization probability depends on posterior.

  Real applications:
  - **MD Anderson Phase 2 program**: standard Bayesian monitoring
    on most single-arm Phase 2 oncology trials.
  - **BATTLE / BATTLE-2** (in corpus).
  - **I-SPY2** (in corpus) — PPP-based monitoring.
  - **Ibrutinib Phase 2** in CLL (Byrd et al.) used this framework.

  Software ecosystem:
  - **bayesDP**: Bayesian Phase 2/3 simulation.
  - **ph2bayes**: simple Phase 2 designs.
  - **RBesT**: evidence synthesis.
  - Commercial: **East Bayes** (Cytel), **FACTS** (LumenIR).
