  notes: |
    **Thall-Simon (1994 Biometrics) and Thall-Simon-Estey (1995
    Stat Med)** are foundational papers for **Bayesian continuous
    interim monitoring** in Phase 2 oncology trials. Widely adopted
    as the standard for MD Anderson single-arm Phase 2 protocols.

    **Core framework**:
    - Specify a beta prior on response rate p.
    - Enroll patients one at a time.
    - After each patient, update posterior p | data.
    - Check stopping rules:
      - Futility: P(p > p0 | data) < δ_fut.
      - Superiority: P(p > p0 | data) > δ_sup.
    - Enrol until stopping rule triggered or max N reached.

    **Example (binary response)**:
    - Target p1 = 0.30, null p0 = 0.10.
    - Prior: Beta(0.5, 4.5) — sceptical.
    - Stopping: futility if P(p > 0.10 | data) < 0.05;
                  superiority if P(p > 0.30 | data) > 0.90.
    - Calibrated via simulation to achieve type I = 0.05, power = 0.80.

    **Typical sample-size behavior**:
    - N from 20-50 for single-arm Phase 2.
    - Expected N under H0: often < 0.7 × max N (due to early stop).
    - Expected N under H1: often close to max N.

    **Extensions** (Thall-Simon-Estey 1995):
    - Multiple outcomes (response AND toxicity) → bivariate
      beta-binomial monitoring.
    - Toxicity-response trade-off (dose-finding / CRM-like setting).
    - Response-adaptive randomization variant.

    **Relationship to other Bayesian methodology**:
    - **CRM (continual reassessment, O'Quigley 1990)**: dose-finding.
    - **Posterior predictive probability (PPP)** of success at final
      analysis: modern alternative monitoring rule.
    - **I-SPY2** (in corpus) uses PPP-style monitoring with RAR.
    - **BATTLE** (in corpus) Bayesian adaptive randomization
      building on Thall-Simon foundations.

    **Regulatory acceptance**:
    - Widely accepted in academic oncology Phase 2.
    - Less common in confirmatory Phase 3.
    - FDA 2010 Bayesian Devices Guidance (in corpus) formalized
      acceptance for medical devices.
    - Phase 2 Bayesian monitoring standard in NCI co-operative
      groups and academic centers.

