caveats: |
  Robust MAP and EXNEX have become mainstream but require
  significant methodological judgment:

  - **Between-trial heterogeneity τ²**: the most influential
    parameter. Over-specifying τ² reduces borrowing; under-
    specifying inflates ESS. Sensitivity analyses essential.
  - **Mixture weight w**: calibration via simulation under realistic
    prior-data conflict scenarios.
  - **Historical data quality**: MAP assumes historical trials are
    comparable. Secular drift, changing SoC, different populations
    all threaten validity.
  - **Extrapolation vs interpolation**: MAP strongest when current
    population close to historical; weaker for extrapolation to
    pediatrics or rare disease.

  Related methodology:
  - **Power prior** (Ibrahim-Chen 2000): raises historical likelihood
    to power α ∈ [0,1]. Simpler but less principled than MAP.
  - **Commensurate prior** (Hobbs-Carlin 2011): smooth transition
    between borrowing and not.
  - **Bayesian model averaging**: average across several priors with
    different amounts of historical weight.
  - **Dynamic borrowing**: trial-specific borrowing based on
    observed concordance.

  Operational tools:
  - **RBesT**: Novartis-maintained canonical implementation.
  - **psborrow**: commensurate prior variants.
  - **bhmbasket**: BHM + EXNEX for basket trials.
  - **BayesLogit, rstan**: custom Bayesian fitting.

  Current research directions:
  - **Prior-data conflict diagnostic** via posterior predictive
    checks (PPC) — assess whether to borrow.
  - **Scaled-information borrowing**: calibrated ESS based on
    actual versus expected observed variance.
  - **Platform-specific MAP**: ongoing trials continually update
    control prior (RECOVERY, REMAP-CAP).
