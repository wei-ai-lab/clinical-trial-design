id: 2009_RE-LY_af
family: fixed-non-inferiority
source:
  kind: published-trial
  citation: "Connolly SJ, Ezekowitz MD, Yusuf S, et al. Dabigatran versus warfarin in patients with atrial fibrillation. N Engl J Med. 2009;361(12):1139-1151."
  doi: "10.1056/NEJMoa0905561"
  nct_id: "NCT00262600"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa0905561"

design:
  indication: "Atrial fibrillation with ≥ 1 risk factor for stroke"
  population: "Adults with non-valvular AF and stroke risk factor"
  arms:
    - name: "dabigatran 110 mg bid"
      allocation: 1
    - name: "dabigatran 150 mg bid"
      allocation: 1
    - name: "warfarin (INR 2-3)"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "Stroke or systemic embolism"
    measurement_time: "time-to-first-event"
  comparison: non-inferiority
  sidedness: 1
  alpha: 0.025
  power: 0.84
  effect:
    hr: 1.0                       # NI powered under null effect
    margin: 1.46                  # HR NI margin (derived from historical warfarin-vs-placebo meta-analysis)
    margin_method: "fixed-margin 95/95, 50% retention of warfarin vs placebo effect"
    control_annual_rate: 0.016
  accrual:
    duration_months: 24
  followup:
    median_months: 24
  multiplicity:
    strategy: "Each dose tested independently vs warfarin; no formal α-split (two one-NI-margin-tests)"

expected:
  sample_size_total: 18113
  events_total: 302
  tolerance:
    sample_size_pct: 3
    events_pct: 5
  notes: |
    The NI margin of 1.46 derives from a meta-analysis of warfarin vs placebo
    showing HR ~0.36 for stroke prevention (retention of 50% gives allowable
    attenuation to HR 0.60 of baseline, inverse gives margin 1/0.68 ≈ 1.46).
    Event count is relatively small because warfarin is highly effective; low
    residual event rate requires very large N.

r_packages:
  - gsDesign::nSurv
  - rpact::getSampleSizeSurvival

tags:
  - atrial-fibrillation
  - anticoagulation
  - noac
  - ni-margin-1.46
  - three-arm
  - fixed-margin-method

caveats: |
  Three-arm trial with common active control (warfarin). Each dabigatran dose
  tested independently at α = 0.025 one-sided — no α-split because NI tests
  are independent by design (no family-wise inflation if both fail).
  Primary analysis was PROBE (prospective randomized open blinded endpoint),
  with adjudicated events.
