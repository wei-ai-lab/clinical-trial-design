  tolerance:
    sample_size_pct: 15
  notes: |
    **Friede-Stallard 2008** is the canonical methodological
    comparison among adaptive-selection approaches. For a Phase 3
    team choosing between methods, this paper is the single best
    reference.

    **Methods evaluated**:
    1. **Classical Dunnett-based GS** — no adaptation. Baseline.
    2. **Thall-Simon-Ellenberg drop-the-loser** — sufficient-stat
       approach, but constrained selection rule (drop bottom arm
       at interim).
    3. **Stallard-Todd seamless** — sufficient-stat + flexible rule
       but conservative.
    4. **Bauer-Kieser / Posch-Koenig combination test** — most
       flexible but with power cost from combining p-values.

    **Simulation results**:
    - All four control FWER at α.
    - Power to reject with best arm: Stallard-Todd > Dunnett ≈
      drop-the-loser > combination test (by ~5%).
    - Expected N: combination test highest savings if selection is
      aggressive; Stallard-Todd competitive.
    - Bias in selected-winner estimate: worst for Dunnett (no
      correction), best for combination test with conditional-error
      bias adjustment.

    **Design recommendations from the paper**:
    - If selection rule is pre-specified and simple (drop bottom
      arm), use Stallard-Todd.
    - If flexibility (data-driven rules, mid-trial changes) is
      required, use combination-test framework.
    - If in doubt, simulate both.

    **Why this matters**:
    - Gives a quantitative basis for method selection — prior
      literature advocates one framework or another without
      head-to-head comparison.
    - Informs FDA 2019 Adaptive Designs guidance which cross-
      references these methods without prescribing one.

