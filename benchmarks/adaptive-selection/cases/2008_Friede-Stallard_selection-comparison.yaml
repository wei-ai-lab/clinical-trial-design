caveats: |
  Friede-Stallard 2008 remains the go-to when teams must choose
  among adaptive-selection methods. Limitations of the comparison:
  - Simulations are on continuous endpoints; relative performance
    differs for binary (where overdispersion matters) and TTE
    (where information fraction handling differs).
  - No formal optimality analysis — just head-to-head under chosen
    configurations.
  - Later work (Magirr-Jaki-Whitehead 2012, in corpus) showed that
    generalized Dunnett can recover much of the combination-test
    flexibility while retaining sufficient-statistic power.

  Real-world framework selection:
  - Pfizer and Novartis have published adaptive-selection trial
    protocols using both Stallard-Todd and Bauer-Kieser approaches
    in the same clinical program depending on the specific decision
    context.
  - Regulatory acceptance has broadened post-FDA 2019 guidance;
    EMA also pragmatic about method choice.

  Modern alternatives not covered in the 2008 paper:
  - MAMS (Jaki-Magirr 2013) for multi-arm multi-stage with flexible
    selection.
  - Royston-Parmar-Qian 2011 for TTE multi-arm selection.
  - Bayesian optimal selection (Berry et al.) for small Phase 2b
    selection.
