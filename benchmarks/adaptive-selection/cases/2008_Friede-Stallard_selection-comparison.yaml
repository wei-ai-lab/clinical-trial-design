  effect:
    methods_compared: |
      (1) Dunnett-based parallel GS (no adaptation).
      (2) Thall-Simon-Ellenberg drop-the-loser (1988).
      (3) Stallard-Todd seamless selection (2003) with sufficient
          statistics.
      (4) Bauer-Kieser / Posch-Koenig combination-test flexible design.
    performance_metrics: |
      - Type I error (FWER) under null / LFC / equal effects.
      - Power to select best and reject H0.
      - Expected sample size under each configuration.
      - Bias of effect estimate for selected winner.
    key_finding: "Flexible combination-test designs lose ~5-10% power relative to Stallard-Todd's sufficient-statistic approach when selection is rule-based, but are more robust to rule deviations"
