caveats: |
  Adaptive Dunnett test considerations:

  - **Pre-specification required**: adaptation rules, stage-1 critical
    values, combination weights — all locked in protocol. Post-hoc
    changes invalidate FWER.
  - **Closed testing complexity**: 2^K − 1 intersection hypotheses
    grows exponentially. Practical for K ≤ 5-6; larger K uses
    hierarchical simplifications (gatekeeping).
  - **Dunnett correlation assumption**: tests assumed correlated per
    Dunnett's formula (common control). Violations (e.g., stratified
    analysis) may slightly inflate FWER.
  - **Normal-case derivation**: exact formulas for normal; binary/TTE
    use asymptotic approximations.
  - **Information fraction**: weighted combination uses pre-specified
    weights (equal, or n-based). Information-based w ∝ √n_k is
    near-optimal.

  **Operating characteristics (illustrative, K = 3, n = 30 + 60)**:
  | Scenario | DTL single winner | Adaptive Dunnett |
  |---|---|---|
  | All 3 arms Δ = 0 | FWER 0.025 | FWER 0.025 |
  | Arm 1 Δ = 0.5, others 0 | Power reject H_0^1 = 0.80 | Similar |
  | Arm 1 Δ = 0.5, arm 2 Δ = 0.3, arm 3 Δ = 0 | P(reject H_0^1) = 0.80, P(reject H_0^2 too) ≈ 0 | P(reject H_0^1) = 0.80, P(reject H_0^2) = 0.45 |

  Adaptive Dunnett advantage: can establish multiple doses
  simultaneously, supporting dose-response labels.

  **Implementation example (conceptual)**:
  ```r
  library(asd)

  # 3-arm design with adaptive Dunnett
  sim <- sim.adaptive.dunnett(
    K = 3,                          # experimental arms
    n1 = 30, n2 = 60,               # stage sizes
    alpha = 0.025,
    delta_true = c(0.5, 0.3, 0.0),  # true effects
    sigma = 1,
    adaptation = "drop_worst",      # pre-specified rule
    n_sim = 10000
  )
  sim$fwer                          # should be ≤ 0.025
  sim$power_by_arm                  # power to reject each H_0^k
  ```

  **Extensions and related**:
  - **Dunnett (1955)**: original multiple-comparison correction.
  - **Bauer-Kohne (1994)**: conditional error function foundation.
  - **Muller-Schafer (2001)**: α-adaptive extension.
  - **Posch-Koenig (2005)**: GS + selection combined.
  - **Koenig et al. 2008 (this case)**: adaptive Dunnett unification.
  - **Friede-Kieser 2013**: combining selection + SSR.
  - **Magirr-Jaki-Whitehead 2012 (in corpus)**: generalized Dunnett
    MAMS framework (companion case).

  **Regulatory framing**:
  - **FDA 2019 Adaptive Designs Guidance**: multi-arm adaptive with
    FWER control explicitly addressed.
  - **EMA 2007 CHMP Reflection Paper**: Bauer-Kohne framework
    explicitly acknowledged.
  - Key requirement: strong FWER control (all individual null
    hypotheses protected).

  **Modern applications**:
  - **STAMPEDE** (multiple prostate cancer arms, in corpus): multi-arm
    platform uses adaptive Dunnett-like logic.
  - **RECOVERY**: COVID platform with multiple drugs.
  - **Dose-finding**: Phase 2b/3 seamless with 2-3 doses.
  - **RA / IBD trials**: multiple JAK or biologic doses simultaneously.
