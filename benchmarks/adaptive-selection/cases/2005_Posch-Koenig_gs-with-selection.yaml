caveats: |
  Posch et al. 2005 remains a core reference. Strengths:
  - Strong FWER control under arbitrary selection rules.
  - Flexibility in combination function and stopping boundaries.
  - Extends naturally to the enrichment setting (Brannath-Posch-
    Bauer 2002; Brannath-Mehta 2009).

  Limitations in practice:
  - Selection bias in effect estimates for 'winning' arm is a real
    issue for post-trial decision-making (labeling, pricing).
  - Combination-test framework yields p-values but not smooth
    likelihood-based confidence intervals — reviewers sometimes
    prefer conditional-power spending designs that retain
    sufficiency.

  Real implementations using this framework:
  - INHANCE (indacaterol COPD, 2010) — seamless Phase 2/3.
  - Several Pfizer / Novartis seamless dose-selection trials.
  - TAPPAS (angiosarcoma, 2019) uses closely related machinery for
    enrichment rather than pure selection.

  FDA and EMA are familiar with this framework; the 2019 FDA Adaptive
  Designs guidance explicitly discusses closed-testing combination-
  test approaches for treatment selection.
