  notes: |
    **Posch-Koenig-Branson-Brannath-Dunger-Bauer 2005** is the
    canonical unified framework for **group-sequential trials with
    adaptive treatment selection**. It integrates three earlier
    streams:
    - Bauer-Kieser combination tests (1999).
    - Stallard-Todd seamless selection (2003).
    - Group-sequential monitoring (Lan-DeMets, Proschan-Hunsberger).

    **Key methodological contribution**:
    - Unified machinery for combining interim p-values across stages
      (Fisher / inverse-normal / weighted).
    - Closed-testing principle applied across the multiple
      experimental arms to control FWER ≤ α.
    - Proof that *any* data-driven selection rule (even adversarial)
      preserves type I error as long as the test construction uses
      the combination principle correctly.

    **Estimation aspects**:
    - Naive point estimates of effect in the 'selected winners' arm
      are biased upward (selection bias).
    - Paper provides unbiased / bias-reduced estimators (Brannath-
      Posch approach; conditional inference).
    - Confidence intervals require repeated-testing-corrected
      machinery (asd package) since naive CI under-covers.

    **Design flexibility**:
    - Number of interim looks.
    - Number of experimental arms (pre-specified).
    - Selection rule class (drop-the-loser, top-r, threshold-based).
    - Combination function (Fisher p-values or inverse-normal).
    - Alpha spending across stages.

    **Why this matters**:
    - Foundational reference cited by ~every subsequent adaptive-
      selection paper including Magirr-Jaki-Whitehead 2012.
    - Enables flexible mid-trial decisions without sacrificing FWER.
    - Basis for numerous seamless Phase 2/3 implementations
      (INHANCE 2010, many immunology trials).

