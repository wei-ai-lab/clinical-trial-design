caveats: |
  Sampson-Sill drop-the-losers considerations:

  - **Winner's curse bias**: naive analysis of selected arm overestimates
    true effect. Correction essential before product labeling or
    subsequent confirmatory planning.
  - **Known vs unknown σ**: original Sampson-Sill assumes known σ.
    For unknown σ, estimator plugs in σ̂ with some precision loss.
  - **Selection rule**: simple "pick maximum" is optimal under normal
    case; alternative rules (threshold-based, ranked) may differ.
  - **Multiple winners**: if ties or near-ties at interim, which arm
    wins? Pre-specify tie-breaker in protocol.
  - **Early-stopping for futility**: most designs add futility boundary;
    Sampson-Sill framework extends.

  **Sample-size calculation (illustrative)**:
  ```r
  # Conceptual (requires custom code):

  library(mvtnorm)

  # K = 3 experimental + control, normal endpoint
  K <- 3
  sigma <- 1
  alpha <- 0.025
  power <- 0.80
  delta <- 0.5                     # expected effect size (best arm)

  # Stage 1 per arm
  n1 <- 25

  # Stage 2 for selected arm
  n2 <- 75

  # Weights based on information fractions
  w1 <- sqrt(n1 / (n1 + n2))
  w2 <- sqrt(n2 / (n1 + n2))

  # Critical value: numerical root-finding such that
  # P(Z_final > c | any arm selected under H_0) = alpha
  # For K = 3, c ≈ 2.15 (vs 1.96 for K = 1)
  c_alpha <- 2.15

  # Power: simulate across K-arm MVN with selection + final test
  ```

  **Critical-value adjustments (approximate)**:
  | K arms | DTL critical value (α = 0.025) |
  |---|---|
  | 1 | 1.96 |
  | 2 | 2.08 |
  | 3 | 2.15 |
  | 4 | 2.20 |
  | 5 | 2.24 |
  | 10 | 2.38 |

  Increases slowly because selection is "free" when other arms
  truly don't work under global null.

  **Relationship to other cases in corpus**:
  - **Thall-Simon-Ellenberg 1988**: first general framework; Sampson-
    Sill provides exact normal-case details.
  - **Stallard-Todd 2003**: binary endpoints, α-spending approach.
  - **Posch-Koenig 2005**: GS + selection combined.
  - **Bretz-Schmidli 2006**: Bretz closed-testing with combination.
  - **Friede-Stallard 2008**: binary-case extensions, multiple winners.
  - **Magirr-Jaki-Whitehead 2012**: unified MAMS framework.

  **Why normal case first**:
  - Exact MVN distribution of (T_1, ..., T_K) tractable.
  - Critical values computable via multivariate normal integration.
  - Conditionally unbiased estimator has closed form.
  - Extensions to binary/TTE use approximations anchored to normal.
