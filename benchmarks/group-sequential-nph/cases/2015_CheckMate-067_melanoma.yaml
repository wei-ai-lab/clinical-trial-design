id: 2015_CheckMate-067_melanoma
family: group-sequential-nph
source:
  kind: published-trial
  citation: "Larkin J, Chiarion-Sileni V, Gonzalez R, et al. Combined nivolumab and ipilimumab or monotherapy in untreated melanoma. N Engl J Med. 2015;373(1):23-34."
  doi: "10.1056/NEJMoa1504030"
  nct_id: "NCT01844505"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1504030"

design:
  indication: "Advanced unresectable or metastatic melanoma"
  population: "Untreated BRAF WT or mutant, ECOG 0-1"
  arms:
    - name: "nivolumab 1 mg/kg + ipilimumab 3 mg/kg"
      allocation: 1
    - name: "nivolumab 3 mg/kg"
      allocation: 1
    - name: "ipilimumab 3 mg/kg"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "PFS (BICR) and OS; co-primary"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  alpha_split: "Graphical Bretz-Maurer across 4 hierarchical tests (PFS/OS × 2 pairwise)"
  power: 0.90
  effect:
    hr_combo_vs_ipi: 0.65
    hr_nivo_vs_ipi:  0.75
    control_median_pfs_months: 3.0
    delayed_onset_months: 3   # assumed no effect in first 3 months
  accrual:
    duration_months: 24
  followup:
    planned_months: 60
  interim_analyses:
    - number: 1
      endpoint: PFS
      information_fraction: 0.60
    - number: 2
      endpoint: PFS
      information_fraction: 1.0
    - number: 3
      endpoint: OS
      information_fraction: 0.70
    - number: 4
      endpoint: OS
      information_fraction: 1.0
    spending: "Lan-DeMets OBF α-spending per-family"
    futility: "Not pre-specified (DSMB discretion)"

expected:
  sample_size_total: 945
  events_pfs: 550
  events_os: 555
  tolerance:
    sample_size_pct: 3
    events_pct: 5
  notes: |
    Delayed-effect NPH design. As-designed computation used gsDesign2 average-HR
    workflow with piecewise exponential (no effect months 0-3, HR 0.65 thereafter).
    Observed HR (PFS combo vs ipi) was 0.42 — much larger than assumed — which
    compensated for any log-rank loss-of-power under NPH. Trial teaches that
    under delayed-effect anticipated, weighted log-rank or max-combo should be
    pre-specified; design team chose log-rank with assumed-HR 0.65 which was
    conservative enough to tolerate NPH.

r_packages:
  - gsDesign2::gs_design_ahr
  - simtrial::sim_pw_surv
  - nphDesign

tags:
  - melanoma
  - checkpoint-inhibitor
  - three-arm
  - co-primary-endpoints
  - delayed-effect
  - nph
  - graphical-multiplicity

caveats: |
  The nivolumab-monotherapy vs combo-nivo-ipi comparison was not formally
  powered; the trial design did not support a superiority claim of combo over
  nivo monotherapy. This distinction matters for label expansion and payer
  decisions. Also note that in this design the α-spending was across 4
  hierarchical endpoints, which must be handled carefully in reproduction.
