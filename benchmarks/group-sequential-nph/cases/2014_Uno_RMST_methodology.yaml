id: 2014_Uno_RMST_methodology
family: group-sequential-nph
source:
  kind: methodology-paper
  citation: "Uno H, Claggett B, Tian L, Inoue E, Gallo P, Miyata T, Schrag D, Takeuchi M, Uyama Y, Zhao L, Skali H, Solomon S, Jacobus S, Hughes M, Packer M, Wei LJ. Moving beyond the hazard ratio in quantifying the between-group difference in survival analysis. J Clin Oncol. 2014 Aug 1;32(22):2380-5."

design:
  indication: "Oncology and cardiovascular trials with time-to-event endpoints under non-proportional hazards"
  population: "Any TTE trial where PH assumption is questionable (IO oncology, delayed-effect therapies, heart failure with SGLT2i)"
  arms:
    - name: "experimental"
      allocation: 1
    - name: "control"
      allocation: 1
  endpoint:
    type: tte
    description: "Restricted Mean Survival Time (RMST) — area under KM curve to a pre-specified time τ"
    measurement_time: "fixed truncation time τ (typically minimum observed follow-up)"
  comparison: superiority
  sidedness: 1
  alpha: 0.025
  power: 0.80
  effect:
    test_statistic: "Difference in RMST between groups: Δ(τ) = RMST_exp(τ) - RMST_ctrl(τ); hours / months / years"
    variance: "Robust variance via survival::survfit + martingale residuals; Greenwood-like formula"
    advantages_vs_hr: |
      - Model-free — no PH assumption.
      - Clinically interpretable (additional months of life / event-
        free survival at τ).
      - Meaningful under crossing hazards, delayed effect, cure
        fractions.
    relationship_to_hr: "Under PH, RMST difference and HR carry equivalent information; under NPH, they can diverge"
    truncation_time_choice: "τ chosen to maximize power while retaining clinical interpretability; typically min follow-up across groups"
  accrual:
    duration_months: null
  followup:
    planned_months: null

expected:
  sample_size_total: null
  events_total: null
  tolerance:
    sample_size_pct: 15
  notes: |
    **Uno et al. 2014 (JCO)** is the canonical advocacy paper for
    **Restricted Mean Survival Time (RMST)** as a primary endpoint
    in TTE trials. It catalyzed industry adoption of RMST alongside
    (or instead of) the hazard ratio in NPH settings.

    **Core argument**:
    - HR assumes proportional hazards; when PH fails (IO oncology
      delayed effect, crossing curves, cure fractions), HR is
      time-averaged and misleading.
    - RMST Δ(τ) = ∫_0^τ [S_exp(t) - S_ctrl(t)] dt is model-free and
      clinically interpretable ('X more months of life over τ years').
    - Under PH, HR and RMST carry equivalent info; under NPH, RMST
      preserves its interpretation while HR does not.

    **Sample-size calculation**:
    - Requires specification of full survival curves in each arm
      (not just HR).
    - Variance formula via robust martingale residuals; easily
      implementable.
    - `npsurvSS::size_two_arm(test = list(test = 'rmst', milestone = τ))`
      gives design-based sample size.

    **Power comparison to logrank**:
    - Under PH with late effect, logrank slightly more powerful;
      RMST slightly less.
    - Under crossing curves or delayed effect, RMST often beats
      logrank substantially.
    - MaxCombo test (in corpus under NPH entries) combines logrank
      with weighted variants for max power across NPH types.

    **Regulatory acceptance**:
    - FDA 2021 Non-Proportional Hazards Workshop endorsed RMST as
      a complementary summary.
    - Used as secondary (occasionally primary) in IO oncology
      labeling (e.g., pembrolizumab, nivolumab program).
    - EMA 2020 draft guidance on oncology endpoints discusses RMST.

    **Operational considerations**:
    - Requires uniform follow-up or careful handling of administrative
      censoring — RMST at τ undefined if censoring precedes τ.
    - Truncation time τ must be pre-specified; typical choice is
      minimum follow-up across arms at primary analysis.

r_packages:
  - survRM2 (Uno et al. — canonical RMST analysis)
  - npsurvSS (RMST-based sample sizing, NPH designs)
  - rpact (GS with RMST)
  - fastRMST
  - survRM2adapt (covariate-adjusted RMST)

tags:
  - uno
  - rmst
  - restricted-mean-survival
  - nph
  - non-proportional-hazards
  - model-free
  - methodology-canonical
  - clinical-interpretation

caveats: |
  RMST has become mainstream for NPH settings but is not without
  limitations:
  - Requires choosing τ — results depend on this choice.
  - For very late-occurring effects (large τ needed), RMST analysis
    data-hungry; quantile methods (median difference) may be
    complementary.
  - Variance estimation at small N (< 50 events) can be unstable;
    use bootstrap or permutation for N < 50.

  Alternative / complementary NPH approaches:
  - **MaxCombo** (Lin-Magirr 2019, Magirr-Burman 2019 in corpus):
    combines logrank with FH(0,1) weighted tests.
  - **Fleming-Harrington weighted logrank** (FH 1981): parametric
    weight choice.
  - **Milestone analysis**: survival probability at fixed t —
    extreme case of 'RMST at τ' with τ reduced to a point.
  - **Weighted Kaplan-Meier** (Pepe-Fleming): similar to RMST.

  Real applications in Phase 3:
  - **CheckMate-067** (melanoma): RMST secondary.
  - **EMPEROR-Preserved** (HF, SGLT2i): RMST reported alongside HR.
  - Several IO oncology programs use RMST as sensitivity analysis.

  Regulatory context (FDA 2021 NPH workshop):
  - HR remains primary for registrational trials.
  - RMST accepted as complementary / sensitivity analysis.
  - Trials with expected NPH should pre-specify non-logrank tests or
    MaxCombo.
