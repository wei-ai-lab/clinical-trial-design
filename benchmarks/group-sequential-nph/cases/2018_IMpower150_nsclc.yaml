id: 2018_IMpower150_nsclc
family: group-sequential-nph
source:
  kind: published-trial
  citation: "Socinski MA, Jotte RM, Cappuzzo F, et al. Atezolizumab for first-line treatment of metastatic nonsquamous NSCLC. N Engl J Med. 2018;378(24):2288-2301."
  doi: "10.1056/NEJMoa1716948"
  nct_id: "NCT02366143"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1716948"

design:
  indication: "Metastatic non-squamous NSCLC, first-line"
  population: "Untreated stage IV non-squamous NSCLC; includes EGFR/ALK+ post-TKI"
  arms:
    - name: "ABCP: atezolizumab + bevacizumab + carboplatin + paclitaxel"
      allocation: 1
    - name: "ACP: atezolizumab + carboplatin + paclitaxel"
      allocation: 1
    - name: "BCP: bevacizumab + carboplatin + paclitaxel"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "PFS (INV) and OS in ITT-WT; hierarchical ABCP vs BCP and Teff-high subgroup"
    measurement_time: "time-to-first-event (PFS), time-to-event (OS)"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  alpha_split: "Graphical Bretz-Maurer with α-recycling across PFS/OS × ITT-WT/Teff-high"
  power: 0.85
  effect:
    hr_pfs: 0.70
    hr_os:  0.78
    control_median_pfs_months: 7
    control_median_os_months:  15
  accrual:
    duration_months: 18
  followup:
    planned_months: 18
  interim_analyses:
    - number: 1
      endpoint: PFS
      information_fraction: 0.75
    - number: 2
      endpoint: PFS
      information_fraction: 1.0
    - number: 3
      endpoint: OS
      information_fraction: 0.50
    - number: 4
      endpoint: OS
      information_fraction: 0.75
    - number: 5
      endpoint: OS
      information_fraction: 1.0
    spending: "Lan-DeMets OBF α per primary endpoint"
    futility: "Not pre-specified"

expected:
  sample_size_total: 1200
  actual_sample_size: 1202
  events_pfs_itt_wt: 570
  tolerance:
    sample_size_pct: 3
    events_pct: 5
  notes: |
    Three-arm IO combo design with complex graphical α-propagation. The
    ABCP vs BCP comparison is the primary contrast; ACP vs BCP is
    secondary. NPH is anticipated in ABCP vs BCP (atezo's delayed effect
    partly offset by bev+chemo backbone). Observed PFS HR 0.62 and OS HR
    0.78 suggest moderate near-PH behavior overall, though the chemo
    component again masks pure IO NPH signature.

r_packages:
  - gsDesign::gsSurv
  - gsDesign2::gs_design_ahr
  - gMCP   # for graphical multiplicity verification

tags:
  - nsclc
  - non-squamous
  - atezolizumab
  - combo-io
  - three-arm
  - graphical-multiplicity
  - egfr-alk-subgroup

caveats: |
  Graphical α-recycling (Bretz-Maurer) is the key novelty. The design
  supports testing multiple arms × multiple endpoints × multiple
  populations while controlling strong FWER. Reproducing requires the
  gMCP R package in addition to gsDesign2. Note: pre-specified subgroups
  (EGFR/ALK+, Teff-high) are formally part of the α-spending graph
  even though population enrichment is not the primary analysis.
