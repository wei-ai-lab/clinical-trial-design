id: 2017_PACIFIC_nsclc
family: group-sequential-nph
source:
  kind: published-trial
  citation: "Antonia SJ, Villegas A, Daniel D, et al. Durvalumab after chemoradiotherapy in stage III non-small-cell lung cancer. N Engl J Med. 2017;377(20):1919-1929."
  doi: "10.1056/NEJMoa1709937"
  nct_id: "NCT02125461"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1709937"

design:
  indication: "Stage III unresectable NSCLC"
  population: "No progression after ≥ 2 cycles platinum-based chemoradiation"
  arms:
    - name: "durvalumab 10 mg/kg q2w up to 12 months"
      allocation: 2
    - name: "placebo"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "PFS (BICR) and OS; dual primary with hierarchical testing"
    measurement_time: "time-to-first-event (PFS), time-to-event (OS)"
  comparison: superiority
  sidedness: 1
  alpha: 0.025   # per dual-primary endpoint
  power: 0.90
  effect:
    hr_pfs: 0.67
    hr_os:  0.73
    control_median_pfs_months: 10
    control_median_os_months:  24
    delayed_onset_months: 2
  accrual:
    duration_months: 24
  followup:
    planned_pfs_months: 12
    planned_os_months:  36
  interim_analyses:
    - number: 1
      endpoint: PFS
      information_fraction: 0.70
    - number: 2
      endpoint: PFS
      information_fraction: 1.0
    - number: 3
      endpoint: OS
      information_fraction: 0.60
    - number: 4
      endpoint: OS
      information_fraction: 0.80
    - number: 5
      endpoint: OS
      information_fraction: 1.0
    spending: "Lan-DeMets OBF α per endpoint; hierarchical gatekeeping PFS → OS"
    futility: "Not pre-specified"

expected:
  sample_size_total: 702
  actual_sample_size: 713
  events_pfs: 458
  events_os: 491
  tolerance:
    sample_size_pct: 3
    events_pct: 5
  notes: |
    Consolidation-therapy design with 2:1 allocation to durvalumab. Delayed-
    effect NPH is visible in PFS KM curves (~2 month overlap before
    separation) but not severe enough to defeat log-rank given the large
    observed HR (0.52 vs assumed 0.67). Hierarchical PFS → OS gatekeeping
    let OS inherit α once PFS succeeded. Trial redefined standard of care
    in stage III unresectable NSCLC.

r_packages:
  - gsDesign::gsSurv
  - gsDesign2::gs_design_ahr

tags:
  - nsclc
  - stage-iii
  - durvalumab
  - consolidation
  - dual-primary
  - delayed-effect
  - hierarchical-gatekeeping
  - allocation-2-to-1

caveats: |
  Dual-primary endpoint α-control requires hierarchical testing: PFS first,
  then OS using the PFS-α if PFS succeeded (no recycling needed since both
  primaries share 0.025 each). PD-L1 expression stratification was added
  by EU regulators post-hoc; US FDA approval covered all-comers.
