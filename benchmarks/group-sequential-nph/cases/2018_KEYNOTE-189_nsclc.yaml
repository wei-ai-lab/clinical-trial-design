id: 2018_KEYNOTE-189_nsclc
family: group-sequential-nph
source:
  kind: published-trial
  citation: "Gandhi L, Rodríguez-Abreu D, Gadgeel S, et al. Pembrolizumab plus chemotherapy in metastatic non-small-cell lung cancer. N Engl J Med. 2018;378(22):2078-2092."
  doi: "10.1056/NEJMoa1801005"
  nct_id: "NCT02578680"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1801005"

design:
  indication: "Metastatic non-squamous NSCLC, first-line, all-comers (PD-L1)"
  population: "Untreated stage IV non-squamous NSCLC, EGFR/ALK wild-type"
  arms:
    - name: "pembrolizumab 200 mg q3w + pemetrexed + platinum"
      allocation: 2
    - name: "placebo + pemetrexed + platinum"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "OS and PFS (BICR) — dual primary, hierarchical"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 1
  alpha: 0.025
  power: 0.85
  effect:
    hr_os: 0.70
    hr_pfs: 0.60
    control_median_os_months: 13
    control_median_pfs_months: 5
  accrual:
    duration_months: 12
  followup:
    planned_months: 24
  interim_analyses:
    - number: 1
      endpoint: OS
      information_fraction: 0.60
    - number: 2
      endpoint: OS
      information_fraction: 0.80
    - number: 3
      endpoint: OS
      information_fraction: 1.0
    - number: 4
      endpoint: PFS
      information_fraction: 0.70
    - number: 5
      endpoint: PFS
      information_fraction: 1.0
    spending: "Lan-DeMets OBF α per endpoint"
    futility: "Not pre-specified"

expected:
  sample_size_total: 616
  events_os: 416
  events_pfs: 410
  tolerance:
    sample_size_pct: 3
    events_pct: 5
  notes: |
    Combo-IO design where chemo backbone provides early tumor cytoreduction,
    producing near-proportional-hazards KM pattern despite the IO component's
    known delayed-effect profile. Observed HR (OS 0.49 vs assumed 0.70) was
    substantially larger than planned — trial hit primary at first interim.
    Benefit was homogeneous across PD-L1 subgroups, supporting all-comer
    first-line approval.

r_packages:
  - gsDesign::gsSurv
  - gsDesign2::gs_design_ahr

tags:
  - nsclc
  - non-squamous
  - pembrolizumab
  - combo-io
  - all-comers
  - dual-primary
  - allocation-2-to-1

caveats: |
  In combo IO + chemo designs, the chemo component masks IO's delayed-effect
  signature by providing early-phase tumor reduction. Log-rank is typically
  adequate. In contrast, IO-only Phase 3s (PACIFIC, CheckMate-067) show
  clear delayed effect and benefit from gsDesign2 piecewise HR planning.
  This contrast is a central teaching point in the NPH corpus.
