caveats: |
  MaxCombo and modestly-weighted logrank have become the de-facto
  modern NPH-aware test choices, but caveats remain:
  - **Pre-specification critical**: choosing weights after seeing
    data invalidates the test.
  - **Power gain vs logrank**: modest (~5-15%) under realistic
    delayed-effect scenarios; rarely transformative.
  - **Sample-size savings**: typically 10-25% fewer events vs
    logrank under well-specified delayed effect; near-neutral under
    PH.

  Other NPH-aware alternatives:
  - **RMST** (Uno 2014, in corpus): complementary, model-free.
  - **Milestone analysis**: survival at fixed t — extreme RMST.
  - **Parametric / piecewise models**: Royston-Parmar flexible
    parametric; sensitive to model specification.
  - **Weighted Kaplan-Meier**: similar to RMST.

  Regulatory acceptance:
  - FDA 2021 NPH workshop endorsed MaxCombo and modestly-weighted
    logrank as acceptable alternatives to logrank when NPH is
    anticipated.
  - EMA similar stance; requires pre-specification.
  - PMDA familiar with MaxCombo from several Japanese Phase 3 IO
    trial designs.

  Open methodological questions:
  - Best way to combine MaxCombo with group-sequential monitoring
    (spending function choice under non-standard test statistic).
  - Estimation of 'treatment effect' after MaxCombo rejection — HR
    and RMST both needed.
