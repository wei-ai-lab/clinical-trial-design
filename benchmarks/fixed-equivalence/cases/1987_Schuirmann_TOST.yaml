caveats: |
  TOST methodology considerations:

  - **90% vs 95% CI confusion**: overall α = 0.05 requires 90% (not 95%)
    two-sided CI. Common source of regulatory review comments when
    sponsors mistakenly use 95% (unnecessarily conservative).
  - **Log transformation default**: FDA/EMA require log-transform for
    AUC/Cmax (multiplicative error structure). Equivalence on log scale
    = GMR equivalence on original scale.
  - **Intra- vs inter-subject variability**: crossover designs use
    within-subject CV, smaller n. Parallel designs use between-subject
    CV, much larger n.
  - **Power at exact boundary**: if true GMR = 1.00, power is max.
    Power drops sharply as true GMR moves toward ε limit — need
    substantial cushion in sample-size planning.
  - **Missing data**: dropouts reduce power non-trivially — FDA expects
    ≥ 75% completer rate. Analysis typically per-protocol (excluded
    dropouts) for BE — opposite of superiority conventions.

  **Sample-size examples (2×2 crossover, GMR target = 1.00)**:
  | CV_w | Power 80% | Power 90% |
  |---|---|---|
  | 15% | 18 | 22 |
  | 20% | 28 | 36 |
  | 25% | 42 | 56 |
  | 30% | 60 | 78 |
  | 35% | 82 | 106 |
  | 40% | 108 | 140 |

  **R implementation (PowerTOST)**:
  ```r
  library(PowerTOST)

  # Standard BE: GMR = 1.00, CV = 20%, 80% power
  sampleN.TOST(
    CV = 0.20,
    theta1 = 0.80,     # lower margin (log(0.80))
    theta2 = 1.25,     # upper margin (log(1.25))
    theta0 = 1.00,     # expected GMR
    targetpower = 0.80,
    design = "2x2"
  )
  # n = 28

  # Reference-scaled BE for highly variable drugs
  sampleN.scABEL(
    CV = 0.40,
    theta0 = 0.90,
    targetpower = 0.80,
    design = "2x3x3"   # partial replicate
  )
  ```

  **Historical context**:
  - **Westlake 1972**: first proposed CI-based BE assessment.
  - **Anderson-Hauck 1983**: an alternative procedure (later shown
    less powerful than TOST near null).
  - **Schuirmann 1987** (this paper): unified TOST, showed it UMP-like.
  - **Hauschke et al. 1992**: exact distributions.
  - **FDA 1992 BE Guidance**: TOST codified.
  - **EMA 2001, 2010**: TOST adopted.
  - **Chow-Liu 2008 "Design and Analysis of Bioequivalence Studies"**:
    canonical textbook.

  **Relationship to other equivalence cases in corpus**:
  - **PLANETRA (2013)**: biosimilar infliximab used TOST-based 95% CI
    (industry convention > 90% for clinical biosimilar endpoints).
  - **V114 lot-consistency (2019)**: TOST for ELISA response ratios.
  - **EMA 2014 biosimilar guideline**: TOST-style for clinical
    comparability.
  - **MYL-1401O trastuzumab biosimilar (2017)**: 90% CI on ORR ratio.

  **Common mistakes**:
  - Using 95% CI instead of 90% (costs power unnecessarily).
  - Forgetting log transformation for PK endpoints.
  - Using between-subject CV for crossover trials (overestimates n).
  - Reporting 80% power when true GMR ≠ 1.00 (power sharply lower).
  - Failing to pre-specify per-protocol analysis population for BE.
