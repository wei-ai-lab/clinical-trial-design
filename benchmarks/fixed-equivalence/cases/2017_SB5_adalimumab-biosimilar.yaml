id: 2017_SB5_adalimumab-biosimilar
family: fixed-equivalence
source:
  kind: published-trial
  citation: "Weinblatt ME, Baranauskaite A, Niebrzydowski J, et al. Phase III randomized study of SB5, an adalimumab biosimilar, versus reference adalimumab in patients with moderate-to-severe rheumatoid arthritis. Arthritis Rheumatol. 2018;70(1):40-48."
  doi: "10.1002/art.40336"
  nct_id: "NCT02167139"
  url: "https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.40336"

design:
  indication: "Moderate-to-severe RA, inadequate response to MTX"
  population: "Adults with active RA on MTX"
  arms:
    - name: "SB5 (adalimumab biosimilar) 40 mg SC q2w"
      allocation: 1
    - name: "Reference adalimumab 40 mg SC q2w"
      allocation: 1
  endpoint:
    type: continuous
    description: "Change from baseline in DAS28-CRP at week 24"
    measurement_time: "24 weeks"
  comparison: equivalence
  sidedness: 2
  alpha: 0.05
  power: 0.9
  effect:
    mean_diff: 0              # H1 assumption
    sd: 1.3                    # DAS28-CRP change SD, pooled
    margin: 0.6                # ±0.6 on DAS28-CRP change (clinically meaningful difference, EMA benchmark)
    margin_method: "EMA biosimilar RA guidance: ±0.6 DAS28 equivalence margin"
  accrual:
    duration_months: 12

expected:
  sample_size_total: 542
  tolerance:
    sample_size_pct: 3
  notes: |
    Continuous-endpoint biosimilar equivalence. Primary endpoint DAS28-CRP
    change is a composite disease activity score treated as continuous.
    ±0.6 margin reflects the minimum clinically important difference for
    DAS28 and aligns with EMA biosimilar guidance.

r_packages:
  - stats::power.t.test
  - gsDesign::nNormal
  - PowerTOST
  - rpact::getSampleSizeMeans

tags:
  - biosimilar
  - adalimumab
  - rheumatoid-arthritis
  - continuous-endpoint
  - das28
  - equivalence-margin-0.6
  - ema-guidance
