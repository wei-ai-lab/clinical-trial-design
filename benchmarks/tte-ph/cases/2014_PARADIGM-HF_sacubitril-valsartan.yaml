caveats: |
  PARADIGM-HF design points:

  - **Run-in design**: 2-week enalapril then 4-6-week LCZ696 run-in
    excluded ~20% intolerant patients. Protects against power loss from
    early discontinuation but limits generalizability.
  - **Active comparator**: enalapril 10 mg BID (SOLVD dose). Some
    critiqued the ACEi dose as lower than titration goal in practice.
  - **Early stopping for benefit**: interim crossed pre-specified
    O'Brien-Fleming efficacy boundary; DSMB unanimously recommended stop.
    Classic teaching case for group-sequential success boundary.
  - **PH assumption**: reasonably supported for this composite endpoint
    over ~2 years. Log-rank and Cox valid.
  - **Composite endpoint**: CV death + first HF hospitalization. Pragmatic
    composite; recurrent-event analysis (LWYY) also performed as secondary.

  **Relationship to subsequent trials**:
  - **PARADISE-MI** (2021): ARNI post-MI — negative.
  - **PARADIGM-MI/HFpEF**: follow-up programs.
  - **PIONEER-HF** (2019): in-hospital initiation.
  - **DAPA-HF** (2019, in corpus): SGLT2i on top of ARNI.

  **Methodology lessons**:
  - Active-comparator superiority requires larger N than placebo.
  - Run-in periods trade generalizability for power.
  - Event-driven composite with PH assumption → classic Cox + log-rank.
  - Early stopping with O'Brien-Fleming preserved overall α.
