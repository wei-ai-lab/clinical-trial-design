id: 2017_CANVAS_diabetes
family: fixed-superiority
source:
  kind: published-trial
  citation: "Neal B, Perkovic V, Mahaffey KW, et al. Canagliflozin and cardiovascular and renal events in type 2 diabetes. N Engl J Med. 2017;377(7):644-657."
  doi: "10.1056/NEJMoa1611925"
  nct_id: "NCT01032629"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1611925"

design:
  indication: "Type 2 diabetes with established cardiovascular disease or high CV risk"
  population: "Adults ≥ 30 y with T2D and prior CV event, or ≥ 50 y with ≥ 2 CV risk factors"
  arms:
    - name: "canagliflozin (100 or 300 mg)"
      allocation: 2
    - name: "placebo"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "MACE composite: CV death, non-fatal MI, non-fatal stroke"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.9
  effect:
    hr: 0.80
    control_annual_rate: 0.022
  accrual:
    duration_months: 36
  followup:
    mean_months: 78
  dropout:
    pct_per_year: 3

expected:
  sample_size_total: 10142
  events_total: 688          # target MACE events for primary analysis
  tolerance:
    sample_size_pct: 5
    events_pct: 5
  notes: |
    CANVAS integrated two parallel trials (CANVAS and CANVAS-R) with shared
    design and pooled primary analysis. Reported N and events are pooled.
    The program also included a hierarchical NI-then-superiority strategy
    for the primary endpoint: rule out HR ≥ 1.3 (FDA-mandated NI margin for
    diabetes CVOTs per 2008 guidance), then test superiority.

r_packages:
  - gsDesign::nSurv
  - rpact::getSampleSizeSurvival

tags:
  - diabetes
  - cvot
  - sglt2
  - mace
  - fda-cvot-guidance
  - ni-then-superiority

caveats: |
  CANVAS formally tested non-inferiority (ruling out HR ≥ 1.3) as a primary
  hypothesis before superiority — a regulatory construct specific to the 2008
  FDA CVOT guidance. A pure superiority-only sample-size calc matches the
  superiority arm of the test; the NI calc uses margin 1.3 and would give a
  different N. The pooled N of 10,142 is the design for both.
