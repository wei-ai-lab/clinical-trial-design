id: 2016_SUSTAIN-6_diabetes
family: fixed-superiority
source:
  kind: published-trial
  citation: "Marso SP, Bain SC, Consoli A, et al. Semaglutide and cardiovascular outcomes in patients with type 2 diabetes. N Engl J Med. 2016;375(19):1834-1844."
  doi: "10.1056/NEJMoa1607141"
  nct_id: "NCT01720446"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1607141"

design:
  indication: "Type 2 diabetes with established CVD or high CV risk (FDA CVOT population)"
  population: "Adults ≥ 50 y with T2D and established CVD/CKD/HF, or ≥ 60 y with CV risk factors"
  arms:
    - name: "semaglutide 0.5 mg weekly"
      allocation: 1
    - name: "semaglutide 1.0 mg weekly"
      allocation: 1
    - name: "placebo"
      allocation: 2           # pooled semaglutide 2:2 vs placebo 1:1 effectively 2:2 with 1:1 pooling
  endpoint:
    type: time-to-event
    description: "MACE: CV death + non-fatal MI + non-fatal stroke"
    measurement_time: "time-to-first-event"
  comparison: non-inferiority    # primary was NI with margin 1.8; superiority tested hierarchically
  sidedness: 1
  alpha: 0.025
  power: 0.9
  effect:
    hr: 1.0                  # NI was tested under null effect
    margin: 1.8              # NI margin (HR upper bound)
    control_annual_rate: 0.036
  accrual:
    duration_months: 12
  followup:
    median_months: 26
  dropout:
    pct_per_year: 2
  multiplicity:
    strategy: "Hierarchical: NI with margin 1.8 then 1.3 then superiority (doses pooled)"

expected:
  sample_size_total: 3297
  events_total: 122          # events for NI at margin 1.8 under point-null HR=1.0
  tolerance:
    sample_size_pct: 5
    events_pct: 5
  notes: |
    SUSTAIN-6 was a "small" CVOT sized for NI only (margin 1.8 per 2008 FDA
    guidance, followed by conditional superiority test). Semaglutide surprised
    with superiority despite NI-only sizing. Classic example of why NI CVOTs
    occasionally "win" superiority even when not powered for it.

r_packages:
  - gsDesign::nSurv
  - rpact::getSampleSizeSurvival

tags:
  - diabetes
  - cvot
  - glp1
  - ni-margin-1.8
  - fda-cvot-guidance
  - small-cvot

caveats: |
  Classified here as "fixed-superiority" because the hierarchical test sequence
  includes superiority; a strict classification as "fixed-non-inferiority" is
  equally valid and SUSTAIN-6 is cross-linked from that family too. The designed
  sample size reflects NI margin 1.8 under HR=1.0; the observed result was
  HR=0.74 (superiority achieved despite the smaller sizing).
