  notes: |
    **Proschan-Hunsberger 1995 (Biometrics)** is the foundational
    paper for **conditional-power-based adaptive sample size
    re-estimation (CP-SSR)** — one of two major lines (the other
    being Cui-Hung-Wang weighted-stat 1999).

    **Core framework**:
    - Two-stage design: stage 1 observes interim test statistic z₁.
    - Stage-2 sample size n₂(z₁) chosen to raise CP to target CP*
      (typical 0.80).
    - Final test uses a *boundary function* A(z₁) that preserves
      type I error regardless of n₂ choice.

    **Key mathematical result**:
    - For type I error preservation, final test rejects if
      z_final ≥ A(z₁) where A is defined so that Pr(reject | H₀)
      = α.
    - With normal endpoints, A(z₁) is computable in closed form.
    - Self-correcting: even if stage-2 N is gamed, FWER holds.

    **Advantages**:
    - Fully efficient conditional on z₁ (unlike Cui-Hung-Wang's
      weighted-statistic approach which uses pre-specified weights).
    - Unbiased final test statistic (uses actual stage-2 data directly).
    - Easy to explain to clinicians — 'boost the N if interim looks
      weak so we reach 80% CP'.

    **Disadvantages**:
    - Requires boundary function A(z₁) which differs from standard
      GS boundaries — harder for reviewers unfamiliar.
    - Conditional on interim, the test is *not* the standard z-test
      with critical value 1.96, so effect estimates and CIs are
      non-standard.

    **Modern usage**:
    - Basis for Mehta-Pocock 2011 'promising zone' (in corpus) —
      CP-SSR with a restricted promising zone (typical CP in 0.30-
      0.80) to limit operational burden.
    - Chen-DeMets-Lan 2004 (in corpus) showed CP-SSR with certain
      decision rules preserves type I error without the boundary
      adjustment — a major simplification used in practice.

    **Operating characteristics** (from the paper):
    - For target CP 0.80 and interim CP ~0.50, N inflation factor
      typically 1.2-1.6×.
    - Maximum inflation capped at n_max (typically 2-3× original).
    - Power recovery to nominal 0.80-0.90 under the specified
      interim effect.

