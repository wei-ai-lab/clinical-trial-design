caveats: |
  Proschan-Hunsberger remains foundational but pure CP-SSR is rarely
  implemented exactly as in the 1995 paper because:
  (1) Chen-DeMets-Lan 2004 showed that if the decision rule is
      restricted to *only* increasing N when CP is in a promising
      zone, the standard z-test preserves α without the A(z₁)
      adjustment.
  (2) Mehta-Pocock 2011 promising-zone extended this and is now
      the go-to practical framework.

  Related methodology lines:
  - Cui-Hung-Wang 1999 weighted statistic (in corpus) — alternative
    line that preserves type I by fixed weights on stage-1 and
    stage-2 statistics, regardless of N change.
  - Lehmacher-Wassmer 1999 — weighted inverse-normal combination.
  - Müller-Schäfer 2001 — conditional error function generalization.

  Regulatory context: FDA 2019 Adaptive Designs guidance discusses
  CP-SSR; generally acceptable if the decision rule is pre-specified
  and type-I-error preservation is demonstrated (either via the
  Proschan-Hunsberger boundary or via the Chen-DeMets-Lan restricted-
  rule argument).

  Bias of final effect estimate under CP-SSR: modest (smaller than
  under adaptive-selection or enrichment) but non-zero; bias-adjusted
  estimators exist (Brannath-Posch).
