  notes: |
    **Jennison-Turnbull 2003 (Stat Med) and 2006 (Biometrika)** are
    the canonical methodological critique of CHW-style SSR — two
    of the most influential papers arguing that **non-adaptive group-
    sequential designs often dominate adaptive SSR in efficiency**.

    **Main argument**:
    - For a planned maximum sample size N_max and nominal power 1-β,
      an optimally-designed GS design (Pampallona-Tsiatis, power-
      family, or ρ-family boundaries) has expected-N properties
      across the effect range that match or beat CHW-weighted SSR.
    - CHW-SSR pays a price for flexibility: the weighted statistic
      is less powerful than the full-information z-statistic.
    - Proschan-Hunsberger CP-SSR avoids this weight penalty but
      requires a non-standard boundary.

    **Efficiency result**:
    - Among all tests of fixed max N that preserve type I and have
      a given interim schedule, the optimal test is achievable by
      a non-adaptive GS — SSR adds no information, it only adds
      operational flexibility.

    **Recommendations**:
    - If flexibility is purely administrative (unblinded team wants
      options), use GS with pre-specified boundaries.
    - If SSR is essential (e.g., nuisance-parameter uncertainty),
      prefer **blinded SSR** on nuisance parameters (Friede-Kieser
      2002, in corpus) rather than unblinded effect-based SSR.
    - If unblinded SSR is required, prefer CP-SSR with Mehta-Pocock
      promising zone (in corpus) over CHW weighted-statistic.

    **Impact**:
    - Influenced FDA 2019 Adaptive Designs guidance — SSR based on
      blinded data is less contentious than unblinded effect-based
      SSR.
    - Shifted industry preference toward blinded SSR or pre-planned
      GS with generous boundaries.
    - Motivated Mehta-Pocock 2011 'promising zone' as a pragmatic
      compromise — only resize when CP is in a specific range, avoiding
      aggressive SSR-driven type I spending.

