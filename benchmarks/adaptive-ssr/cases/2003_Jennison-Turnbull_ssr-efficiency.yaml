caveats: |
  Jennison-Turnbull's critique is widely accepted in principle but
  has practical limits:
  - It assumes the interim information schedule is pre-specifiable.
    When the effect size is highly uncertain (e.g., new mechanism
    in a new indication), pre-specifying boundaries is hard.
  - It assumes non-adaptive GS boundaries are feasible (regulator
    and DSMB accept). Some sponsors prefer SSR because it is easier
    to defend to internal leadership ('we only resize if interim
    is weak').

  Post-JT alternatives:
  - **Blinded SSR** (Friede-Kieser 2002, in corpus): resize based
    on nuisance parameter (variance, event rate) without breaking
    the blind. Universally accepted.
  - **Promising-zone SSR** (Mehta-Pocock 2011, in corpus): only
    increase N when CP is 0.30-0.80; preserves type I without
    boundary adjustment.
  - **Information-based designs**: stop at fixed information rather
    than fixed N; adapts naturally to effect-size uncertainty.

  Regulatory landscape (FDA 2019 adaptive guidance):
  - Blinded SSR: widely acceptable.
  - CP-SSR / promising zone: acceptable with pre-specification.
  - CHW weighted-stat SSR: acceptable but viewed as inefficient per
    Jennison-Turnbull.
  - Aggressive SSR with arbitrary rules: discouraged.
