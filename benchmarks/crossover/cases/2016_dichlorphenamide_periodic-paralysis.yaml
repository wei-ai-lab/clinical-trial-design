id: 2016_dichlorphenamide_periodic-paralysis
family: crossover
source:
  kind: published-trial
  citation: "Sansone VA, Burge J, McDermott MP, et al. Randomized, placebo-controlled trials of dichlorphenamide in periodic paralysis. Neurology. 2016;86(15):1408-1416."
  doi: "10.1212/WNL.0000000000002416"
  nct_id: "NCT00094081"

design:
  indication: "Primary periodic paralysis (hyperkalemic and hypokalemic)"
  population: "Genetically confirmed primary periodic paralysis (CACNA1S, SCN4A, KCNJ2)"
  arms:
    - name: "Dichlorphenamide 50 mg BID"
      allocation: 1
    - name: "Placebo"
      allocation: 1
  endpoint:
    type: count-rate
    description: "Attack rate per week (diary-reported); within-subject comparison"
    measurement_time: "9 weeks per period"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.80
  effect:
    target_rate_ratio: 0.50
    expected_placebo_attack_rate_per_week: 2.5
    washout_weeks: 9
  accrual:
    duration_months: 48
  followup:
    planned_months: 3

expected:
  sample_size_total: 65
  events_total: null
  tolerance:
    sample_size_pct: 20
  notes: |
    Two parallel 2-period AB/BA crossover studies for rare disease
    (periodic paralysis). Separate studies for hyperkalemic (n=44)
    and hypokalemic (n=65) subtypes to respect genetic differences.
    9-week periods with 9-week washout. Primary endpoint: number of
    attacks/week (within-subject difference). Small N enabled by
    crossover efficiency — parallel design would have been infeasible
    in this rare indication. FDA approval 2015 (Keveyis).

r_packages:
  - nlme
  - lme4
  - MASS::glm.nb
  - PowerTOST

tags:
  - periodic-paralysis
  - rare-disease
  - crossover
  - ab-ba
  - dichlorphenamide
  - orphan-drug
  - attack-rate
  - count-rate-crossover

caveats: |
  Rare disease crossover archetype — within-subject efficiency
  enabled pivotal design with ≤ 65 patients per subtype. Long
  washout (9 weeks) required due to slow PK equilibration of
  carbonic anhydrase inhibition and attack-frequency rebound.
  Run-in baseline 9 weeks also used (so total trial duration
  ~45 weeks per subject). Primary analysis on within-subject log-
  attack-rate with period and treatment as fixed effects. FDA
  accepted due to rare disease, strong within-subject signal,
  and open-label extension data.
