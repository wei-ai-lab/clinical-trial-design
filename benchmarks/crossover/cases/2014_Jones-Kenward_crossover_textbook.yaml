caveats: |
  Jones-Kenward remains the most-cited modern crossover reference,
  alongside Senn (2002, in corpus) — Senn is more polemical on
  carryover; J+K more encyclopedic on design construction and
  analysis. For regulatory crossover BE, the FDA 2003 guidance
  (in corpus) and EMA Bioequivalence Guideline (2010, updated) are
  the practical references. Jones-Kenward's treatment of replicate
  designs for highly variable drugs (CV_W > 30%) is the bridge to
  FDA's reference-scaled ABE (RSABE) framework. For N-of-1 studies,
  Duan 2022 (Stat Med) extends J+K's N-of-1 chapter with Bayesian
  hierarchical pooling. Modern extensions not fully covered in J+K:
  incomplete block extensions for ≥ 10 treatments, adaptive crossover
  (period re-randomization), and crossover within platform trial
  structures.
