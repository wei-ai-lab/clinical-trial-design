caveats: |
  EMA and FDA bioequivalence frameworks have converged substantially
  but key differences remain:
  - **RSABE scaling constant**: EMA k=0.760, FDA k=0.89291 →
    different BE acceptance bands for same CV_WR.
  - **NTI drugs**: EMA uses static tighter limits (90-111% both AUC
    and Cmax); FDA uses reference-scaled NTI-specific approach.
  - **Highly variable drugs**: EMA applies RSABE only to Cmax (not
    AUC); FDA applies to both.

  ICH M13A harmonization (2022-2023) is working toward convergence
  but regulatory divergence persists as of 2024-2026.

  Real-world impact on development:
  - Generic companies run country-specific BE designs if pursuing
    FDA and EMA approvals in parallel.
  - Highly variable drugs (≈ 30% of Cmax values in clinical
    databases) benefit from RSABE; often require 40-60% fewer
    subjects with RSABE vs standard ABE.
  - NTI drugs: FDA approach typically leads to larger studies than
    EMA.

  Non-standard considerations (EMA):
  - Fed vs fasting: both required when food effect is substantial.
  - Multiple-strength products: biowaiver applies under specific
    conditions (BCS-based).
  - Endogenous compounds: baseline correction required (EMA
    Questions & Answers).
