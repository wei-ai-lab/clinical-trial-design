caveats: |
  N-of-1 trials remain conceptually attractive but have practical
  limitations:
  - **Chronic stable condition required**: N-of-1 fails if the
    underlying disease evolves rapidly (most oncology, acute
    infections).
  - **Washout**: drugs with long half-lives or pharmacodynamic
    memory make valid crossover difficult; requires careful period
    spacing.
  - **Individual-level power**: small per-patient N limits power;
    Bayesian hierarchical pooling is the mainstream solution.
  - **Regulatory acceptance**: N-of-1 generally not accepted for
    initial approval; useful for post-approval CER and patient-level
    decision support.

  Related methodology:
  - **Duan-Kravitz-Schmid 2013**: framework + Bayesian hierarchical
    pooling (this entry).
  - **Schork 2015 Nature**: advocacy for personalized N-of-1.
  - **Zucker et al. 1997**: pooled N-of-1 trials with hierarchical
    models.
  - **Mirza-Punja-Vohra 2017**: CONSORT extension for N-of-1
    reporting.
  - **Percha-Schork 2015**: N-of-1 for genomics-informed treatment.

  Extensions not covered in 2013 paper:
  - N-of-1 with continuous real-time outcomes (micro-randomized
    trials; Liao-Klasnja-Murphy 2016).
  - Digital health N-of-1 via wearables / apps.
  - N-of-1 within platform / adaptive structures (rare).

  For `designr`: N-of-1 is a canonical multi-period crossover variant
  that requires Bayesian hierarchical or simulation-based sizing;
  falls outside standard 2x2 machinery.
