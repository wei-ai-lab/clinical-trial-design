caveats: |
  ICH E9(R1) is universally applicable but requires significant
  infrastructure:
  - **Protocol writing**: estimand section now mandatory; requires
    trial teams (statistics, medical, regulatory) to negotiate the
    scientific question explicitly.
  - **SAP pre-specification**: handling of each intercurrent event
    defined before analysis.
  - **Sensitivity analysis**: alternative estimands pre-defined
    as sensitivity analyses.

  Key real-world applications:
  - **NEJM papers since 2022** routinely include an estimand
    section per ICH E9(R1).
  - **FDA guidance documents** increasingly reference estimand
    language (e.g., FDA Missing Data 2022 update).
  - **EMA** explicit endorsement; clinical trial applications in
    the EU must now state estimand.

  Related documents:
  - **ICH E9 original** (1998): statistical principles.
  - **ICH E9(R1)** (2019): estimand addendum (this entry).
  - **ICH E10** (2000): choice of control.
  - **FDA Demonstrating Substantial Evidence (2019)**.
  - **ICH E20** (draft): adaptive designs (aligning with E9(R1)).

  Open areas under discussion:
  - **Principal-stratum estimation methods**: IV, sensitivity,
    direct comparison of compliers.
  - **Hypothetical estimands for mortality**: censoring vs imputing
    is still debated.
  - **Dynamic estimands** (changes during trial): not yet addressed.

  For `designr`: estimand pre-specification should be a design-
  level input, affecting sample-size (e.g., MI-based variance
  inflation) and analysis plan generation.
