caveats: |
  RAR is a powerful but contested methodology. Rosenberger-Lachin
  textbook is even-handed — presents benefits (fewer patients on
  inferior arm, ethical appeal) but explicitly catalogues risks:

  - **Chronological bias**: if patient mix changes over time (e.g.,
    seasonality, evolving standard-of-care background), RAR can
    produce biased treatment-effect estimates. Stratification or
    time-adjustment essential.
  - **Type I error inflation** under some nuisance-parameter
    scenarios; requires simulation verification.
  - **Operational complexity**: real-time outcome assessment needed,
    data capture and allocation-probability update infrastructure
    required.
  - **Regulatory skepticism** for confirmatory use — FDA discusses
    RAR in 2019 guidance with careful caveats about pre-specification.

  Historical / modern real applications:
  - **ECMO neonatal trial (Bartlett 1985)**: first major RPW
    application, very controversial.
  - **Fluoxetine suicidality trial** (Tamura 1994).
  - **I-SPY2**: Bayesian adaptive randomization for breast cancer
    Phase 2, platform-structured.
  - **BATTLE/BATTLE-2** (umbrella): Bayesian adaptive randomization
    by biomarker subgroup.
  - **REMAP-CAP**: stratified adaptive-randomization hybrid.

  Modern theoretical refinements:
  - Hu-Zhang optimal allocation for binary (2004).
  - Cheung 2013 constrained adaptive randomization.
  - Thall-Wathen 2007 Bayesian adaptive randomization for oncology.
