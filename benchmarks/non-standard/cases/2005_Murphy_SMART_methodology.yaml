caveats: |
  SMART designs are powerful for chronic-disease sequential-decision
  settings but rarely used in confirmatory pharma Phase 3 because:
  - Two-stage randomization complicates labeling and regulatory
    review.
  - Sample-size per DTR is effectively reduced.
  - Most drug indications don't have a natural response/non-response
    branching structure.

  Real Phase 3 SMART-flavored trials include STAR*D (depression) and
  some HIV adherence trials, but pure SMART designs are more common
  in behavioral interventions, digital health apps (MRT/micro-
  randomized trials, Liao-Klasnja-Murphy 2016), and implementation
  science.

  Related methodology:
  - Q-learning (Watkins, reinforcement learning) applied to estimate
    optimal DTR.
  - Policy learning (Zhao-Laber-Davidian 2015, Luedtke-van der Laan).
  - Bayesian SMART (Wathen-Thall 2008) for adaptive randomization
    within SMART.

  Extensions (post-2005):
  - SMARTs with continuous responder classifications (Almirall 2014).
  - Micro-randomized trials for digital health (Liao et al. 2016).
  - Hybrid SMART + response-adaptive randomization.
