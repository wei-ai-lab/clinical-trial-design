  notes: |
    **Foundational SMART methodology paper**. Susan Murphy's 2005
    paper established the statistical framework for **Sequential
    Multiple Assignment Randomized Trials (SMART)** — the canonical
    design for developing **dynamic treatment regimes (DTRs)**.

    **Design principle**:
    - Recognize that many chronic conditions require sequences of
      decisions, not single treatments.
    - Pre-specify an 'embedded' set of DTRs (rules of the form
      'start with A; if non-response by week 8, switch to C').
    - Randomize at each decision point so that each DTR is
      represented with positive probability.

    **Structure**:
    - Stage 1: randomize all patients to initial treatments.
    - Response assessment at pre-specified time.
    - Stage 2: re-randomize non-responders (and sometimes responders)
      to stage-2 options.
    - Each patient's path through the design represents one of
      several embedded DTRs.

    **Analysis target**:
    - Primary estimand: mean outcome for each embedded DTR.
    - Secondary: pairwise comparisons of DTRs.
    - Weighted or g-computation analysis accounts for the multi-stage
      randomization structure.

    **Sample-size considerations**:
    - DTR comparison requires larger N than two-arm fixed-design
      because the embedded-DTR effective N is typically 50-60% of
      total enrollment.
    - Typical SMART has 200-500 patients.
    - Power calculation via simulation; simple formulas exist for
      two-DTR comparison (Oetting et al. 2011).

    **Real-world SMART trials**:
    - **CATIE schizophrenia** (2005) — large NIMH trial; complex
      staged antipsychotic strategy.
    - **STAR*D depression** (2006) — 4-stage MDD treatment algorithm,
      closest SMART-flavored large trial.
    - **ExTENd alcoholism** (Almirall 2012) — explicit SMART design.
    - **ASTRA-2 childhood ADHD** (2014).

    **Regulatory context**:
    - FDA 2019 Adaptive Designs guidance briefly mentions SMART;
      primarily a health-services-research and academic tool rather
      than confirmatory pharma design.
    - Traditionally used for behavioral / device / HSR interventions;
      less common for drug registrations.

