id: 2019_REDUCE-IT_icosapent
family: group-sequential
source:
  kind: published-trial
  citation: "Bhatt DL, Steg PG, Miller M, et al. Cardiovascular risk reduction with icosapent ethyl for hypertriglyceridemia. N Engl J Med. 2019;380(1):11-22."
  doi: "10.1056/NEJMoa1812792"
  nct_id: "NCT01492361"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1812792"

design:
  indication: "Statin-treated patients with hypertriglyceridemia + established CVD or diabetes + CV risk factor"
  population: "Adults on statin, TG 150-499, LDL 41-100"
  arms:
    - name: "icosapent ethyl 2 g bid"
      allocation: 1
    - name: "placebo (mineral oil)"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "5-component MACE: CV death + MI + stroke + coronary revascularization + unstable angina"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.9
  effect:
    hr: 0.85
    control_annual_rate: 0.055
  accrual:
    duration_months: 45
  followup:
    median_months: 58
  interim_analyses:
    - number: 1
      information_fraction: 0.60
    - number: 2
      information_fraction: 0.8
    - number: 3
      information_fraction: 1.0
    spending: "Lan-DeMets O'Brien-Fleming"

expected:
  sample_size_total: 8179
  events_total: 1612
  boundaries:
    efficacy_z:
      - 2.46       # IF 0.60
      - 2.15       # IF 0.80
      - 2.01       # IF 1.0
  tolerance:
    sample_size_pct: 3
    events_pct: 3
  notes: |
    Ran to final. Observed HR 0.75, much stronger than planned 0.85 —
    large relative risk reduction led to striking results. Post-hoc
    controversy over choice of mineral oil placebo (possibly pro-inflammatory),
    which some suggest may have inflated the apparent treatment effect.

r_packages:
  - gsDesign::gsSurv
  - rpact::getDesignGroupSequential

tags:
  - hypertriglyceridemia
  - omega-3
  - secondary-prevention
  - obf-spending
  - three-look-gs
  - mineral-oil-placebo-controversy
