caveats: |
  α-spending function methodology considerations:

  - **Independent increments**: framework assumes the Z-statistics at
    successive looks have independent increments on the Brownian scale.
    Holds for canonical estimators (sums, log-rank, Cox score, binomial).
    Fails for some non-standard statistics — simulation recommended
    when in doubt.
  - **Information-fraction calibration**: for TTE endpoints,
    information ∝ events observed. For continuous/binary, information ∝
    number of subjects. For Cox models with covariates, information
    fraction is events/total-events at the interim.
  - **Non-binding vs binding futility**: α-spending separately defines
    efficacy and futility spending. Binding futility allows reclaiming
    α; non-binding does not (and is preferred by FDA 2019 Guidance).
  - **Mis-specified spending**: if actual information fractions differ
    substantially from planned, α may be slightly mis-spent. Modern
    practice: recalculate boundaries based on observed information
    (error-spending approach).

  **Comparison of spending functions at α = 0.025 one-sided, K = 5**:
  | t | OBF-like α(t) | Pocock-like α(t) | Z-OBF | Z-Pocock |
  |---|---|---|---|---|
  | 0.2 | 0.000002 | 0.0052 | 4.56 | 2.44 |
  | 0.4 | 0.0006 | 0.0094 | 3.23 | 2.42 |
  | 0.6 | 0.0038 | 0.0129 | 2.63 | 2.41 |
  | 0.8 | 0.0110 | 0.0181 | 2.28 | 2.40 |
  | 1.0 | 0.0250 | 0.0250 | 2.04 | 2.41 |

  **Implementation example (gsDesign)**:
  ```r
  library(gsDesign)

  # Flexible 5-look design with OBF-like α-spending
  d <- gsDesign(
    k = 5,
    test.type = 2,
    alpha = 0.025,
    beta = 0.10,
    sfu = sfLDOF,                          # OBF-like spending
    sfl = sfLDOF,
    timing = c(0.18, 0.35, 0.55, 0.78, 1.0) # UNEQUAL timing ok!
  )
  print(d)

  # If interim 1 happens at info = 0.20 instead of 0.18:
  # Re-compute remaining boundaries given updated information fraction
  d2 <- gsDesign(
    k = 5,
    alpha = 0.025, beta = 0.10,
    sfu = sfLDOF, sfl = sfLDOF,
    timing = c(0.20, 0.35, 0.55, 0.78, 1.0),
    maxn.IPlan = d$n.I[5]                  # fix max sample size
  )
  ```

  **Implementation example (rpact)**:
  ```r
  library(rpact)

  design <- getDesignGroupSequential(
    kMax = 5,
    typeOfDesign = "asOF",                  # OBF-like α-spending
    alpha = 0.025, beta = 0.10,
    sided = 1,
    informationRates = c(0.18, 0.35, 0.55, 0.78, 1.0)
  )
  ```

  **Historical context**:
  - **Pocock 1977** — Biometrika: GS constant-boundary.
  - **O'Brien-Fleming 1979** — Biometrics: decreasing boundary.
  - **Lan-DeMets 1983** (this paper) — Biometrika: α-spending.
  - **Kim-DeMets 1987** — Biometrika: power family.
  - **Hwang-Shih-DeCani 1990** — Stat Med: exponential family.
  - **Pampallona-Tsiatis 1994** — JSPI: unified binding/non-binding.
  - **DeMets-Lan 1994** — Stat Med (companion tutorial): practical use.
  - **Jennison-Turnbull 2000** — textbook (canonical reference).

  **Modern usage patterns**:
  - **sfLDOF** (OBF-like): default for efficacy in confirmatory trials.
  - **sfLDPocock**: rare, used when early stopping is prioritized.
  - **sfHSD(γ = -4)**: close to OBF but smoother.
  - **sfHSD(γ = 1)**: close to Pocock.
  - **sfPower(ρ = 3)**: intermediate, sometimes used for futility.

  **Applications in corpus**:
  - All modern GS efficacy cases (PARADIGM-HF, DAPA-HF, FOURIER,
    EMPA-REG OUTCOME, CheckMate, KEYNOTE series) use sfLDOF or
    equivalent α-spending.
  - sfHSD / sfPower used for binding/non-binding futility in futility
    cases.
