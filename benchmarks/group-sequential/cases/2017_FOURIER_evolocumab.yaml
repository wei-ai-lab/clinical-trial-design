id: 2017_FOURIER_evolocumab
family: group-sequential
source:
  kind: published-trial
  citation: "Sabatine MS, Giugliano RP, Keech AC, et al. Evolocumab and clinical outcomes in patients with cardiovascular disease. N Engl J Med. 2017;376(18):1713-1722."
  doi: "10.1056/NEJMoa1615664"
  nct_id: "NCT01764633"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1615664"

design:
  indication: "Atherosclerotic CVD on statin therapy, LDL ≥ 70 mg/dL"
  population: "Adults with prior MI, stroke, or symptomatic PAD on statin"
  arms:
    - name: "evolocumab 140 mg q2w or 420 mg monthly"
      allocation: 1
    - name: "placebo"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "MACE composite: CV death + MI + stroke + hospitalization for UA + coronary revascularization"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.9
  effect:
    hr: 0.85
    control_annual_rate: 0.045
  accrual:
    duration_months: 24
  followup:
    median_months: 26
  interim_analyses:
    - number: 1
      information_fraction: 0.5
    - number: 2
      information_fraction: 0.75
    - number: 3
      information_fraction: 1.0
    spending: "Lan-DeMets O'Brien-Fleming"
    futility: "None pre-specified; DSMB could recommend stopping for futility informally"

expected:
  sample_size_total: 27564
  events_total: 1630
  boundaries:
    efficacy_z:
      - 2.80
      - 2.34
      - 2.04
  tolerance:
    sample_size_pct: 3
    events_pct: 3
  notes: |
    Ran to final. Observed HR 0.85 on primary MACE matched design assumption
    exactly. Secondary key MACE (CV death + MI + stroke only) HR 0.80.
    Classic modern secondary-prevention CVOT with GS design.

r_packages:
  - gsDesign::gsSurv
  - rpact::getDesignGroupSequential

tags:
  - secondary-prevention
  - pcsk9
  - lipid-lowering
  - obf-spending
  - three-look-gs
  - efficacy-only-gs
