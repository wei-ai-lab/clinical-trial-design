id: 2011_EMPHASIS-HF_hfref
family: group-sequential
source:
  kind: published-trial
  citation: "Zannad F, McMurray JJV, Krum H, et al. Eplerenone in patients with systolic heart failure and mild symptoms. N Engl J Med. 2011;364(1):11-21."
  doi: "10.1056/NEJMoa1009492"
  nct_id: "NCT00232180"
  url: "https://www.nejm.org/doi/full/10.1056/NEJMoa1009492"

design:
  indication: "HFrEF NYHA II, LVEF ≤ 30%"
  population: "Adults with mild HFrEF on GDMT"
  arms:
    - name: "eplerenone titrated to 50 mg daily"
      allocation: 1
    - name: "placebo"
      allocation: 1
  endpoint:
    type: time-to-event
    description: "Composite: CV death or HF hospitalization"
    measurement_time: "time-to-first-event"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.9
  effect:
    hr: 0.80
    control_annual_rate: 0.18
  accrual:
    duration_months: 36
  followup:
    median_months: 21
  interim_analyses:
    - number: 1
      information_fraction: 0.5
    - number: 2
      information_fraction: 0.75
    - number: 3
      information_fraction: 1.0
    spending: "Lan-DeMets O'Brien-Fleming"

expected:
  sample_size_total: 3100
  events_total: 813
  boundaries:
    efficacy_z:
      - 2.80
      - 2.34
      - 2.04
  tolerance:
    sample_size_pct: 5
    events_pct: 5
  notes: |
    Stopped at first planned interim (IF ~0.50) on DSMB recommendation.
    Observed HR 0.63 at that look — well past z-boundary 2.80.
    Established eplerenone for NYHA II HFrEF (milder than RALES population).

r_packages:
  - gsDesign::gsSurv
  - rpact::getDesignGroupSequential

tags:
  - hfref
  - mra
  - eplerenone
  - mild-hf
  - obf-spending
  - stopped-early-efficacy
  - complementary-to-rales
