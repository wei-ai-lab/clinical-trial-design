id: 1979_OBrien-Fleming_boundaries
family: group-sequential
source:
  kind: methodology-paper
  citation: "O'Brien PC, Fleming TR. A multiple testing procedure for clinical trials. Biometrics. 1979 Sep;35(3):549-56. Building on: Pocock SJ. Group sequential methods in the design and analysis of clinical trials. Biometrika. 1977;64(2):191-199."

design:
  indication: "Generic methodology applicable to any clinical trial with pre-specified interim analyses for efficacy stopping"
  population: "Any disease setting with planned group-sequential interim analyses"
  arms:
    - name: "any two-arm or multi-arm comparison"
      allocation: 1
    - name: "control"
      allocation: 1
  endpoint:
    type: any
    description: "Normal, binary, or time-to-event — any endpoint reducible to a Z-statistic with known variance"
    measurement_time: "at each pre-specified interim"
  comparison: superiority
  sidedness: 2
  alpha: 0.05
  power: 0.90
  effect:
    scale: methodology
    boundary_family: |
      O'Brien-Fleming (OBF) efficacy boundaries for K interim analyses
      at information fractions I_1 ≤ I_2 ≤ ... ≤ I_K = 1:

        c_k = c_K · √(I_K / I_k)   (for two-sided test)

      Where c_K is chosen so that overall type I error is α.
      Key property: c_k DECREASES as I_k grows — conservative early,
      approaches fixed-sample critical at final analysis.
    comparison_to_pocock: |
      Pocock 1977 boundary: constant critical value
        c_k = c for all k
      (chosen so overall α preserved).
      - Pocock: easier to stop early, higher expected N under H0.
      - OBF: very hard to stop early, lower α penalty at final.

    numerical_example: |
      K = 5 interim analyses, 2-sided α = 0.05:
      - OBF boundary Z-values (final = 2.04):
        2.04 × √(5/k) for k = 1..5
        → 4.56, 3.23, 2.63, 2.28, 2.04
      - Pocock boundary Z-values: 2.41, 2.41, 2.41, 2.41, 2.41

      Translated to nominal P-values:
      - OBF: 0.000005, 0.0013, 0.0085, 0.022, 0.041
      - Pocock: 0.016, 0.016, 0.016, 0.016, 0.016

    implementation: |
      Original OBF 1979 assumed equally-spaced information looks.
      Generalized via Lan-DeMets α-spending (1983, companion case) for
      flexible timing.
    sample_size_impact: |
      - Fixed sample: N_fixed at α and power.
      - With OBF boundaries at 5 interim looks:
          Maximum N ≈ 1.026 × N_fixed (very small inflation).
      - With Pocock boundaries at 5 looks:
          Maximum N ≈ 1.206 × N_fixed.
      OBF dominates because early boundaries are so conservative.
  accrual:
    duration_months: null
  followup:
    planned_months: null

expected:
  sample_size_total: null
  events_total: null
  tolerance:
    sample_size_pct: 2
  notes: |
    **O'Brien-Fleming 1979** established the **OBF boundary family**
    as the de facto standard for group-sequential efficacy stopping
    boundaries in clinical trials. Published in Biometrics, building on
    Pocock 1977 Biometrika groundwork.

    **Core contribution**:
    - Formula c_k = c_K · √(I_K / I_k) produces boundaries that are
      VERY conservative at early interims and approach the fixed-sample
      critical value at the final analysis.
    - Preserves most of the power at the final analysis.
    - Minimal inflation of maximum sample size (~ 2-3%).
    - Early stops occur only for truly large effects, minimizing
      false-positive risk.

    **Adopted by essentially all confirmatory GS trials**:
    - FDA 2010 Guidance on Adaptive Designs: OBF is the default
      recommended efficacy boundary.
    - All GS oncology trials (CheckMate, KEYNOTE, etc.) use OBF.
    - DMC charters routinely specify OBF for efficacy stopping.

    **Modern generalization**:
    - Lan-DeMets (1983, companion case): α-spending with OBF shape
      for flexible information timing.
    - Hwang-Shih-DeCani: exponential-family α-spending.
    - Wang-Tsiatis power family: OBF / Pocock as special cases
      (Δ = 0 and Δ = 0.5).

    **Implementation in R**:
    - `gsDesign::gsDesign(sfu = sfOF)` — Lan-DeMets OBF spending.
    - `rpact::getDesignGroupSequential(typeOfDesign = "OF")`.

r_packages:
  - gsDesign (Keaven Anderson — canonical)
  - rpact
  - ldbounds
  - gsDesign2
  - Mediana

tags:
  - obrien-fleming
  - obf
  - group-sequential
