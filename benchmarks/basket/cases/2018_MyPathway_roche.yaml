  - simon-2-stage
  - industry-sponsored

caveats: |
  MyPathway's scale and industry sponsorship illustrate different
  trade-offs vs NCI-MATCH (academic) and DRUP (national):
  - **Drug selection** constrained to Roche's portfolio — no
    comparisons across manufacturers' drugs within the same
    pathway.
  - **Pre-specified pathways** only — unlike NCI-MATCH's agnostic
    open protocol.
  - **Cohort expansion decisions** are industry-driven, potentially
    biased by commercial considerations.

  These are not weaknesses per se — they reflect the reality of
  pharmaceutical development where companies build evidence for
  their own compounds across multiple indications.

  Key biological findings:
  - **HER2 in CRC**: strongly responsive to anti-HER2 combination
    → led to tucatinib + trastuzumab accelerated approval 2023.
  - **BRAF V600 non-melanoma**: vemurafenib alone insufficient in
    CRC (needs EGFR blockade) but works in biliary, thyroid.
  - **Hedgehog non-BCC**: generally disappointing (low ORR).
  - **EGFR non-NSCLC**: modest activity except in specific histologies.

  Related industry baskets:
  - **CUPISCO** (Roche, 2020): atezolizumab + chemo for CUP.
  - **TAPUR** (ASCO-sponsored, 2016-present): multi-manufacturer
    version of DRUP-like drug rediscovery.
  - **KEYNOTE-158 and 164** (Merck): pembrolizumab across MSI-H/
    TMB-H tumors — narrower scope.
  - **DRUP** (Dutch national): academic counterpart in corpus.
