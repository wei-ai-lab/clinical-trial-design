caveats: |
  Lung-MAP's decade-long operation illustrates both strengths and
  realities of umbrella trials:

  **Strengths**:
  - Shared screening infrastructure reduces per-sub-study costs.
  - Patient screening paid once, applicable to many future
    sub-studies.
  - Biomarker-based accrual proves mechanistic hypotheses.

  **Challenges**:
  - Biomarker prevalences often lower than anticipated → slow
    per-sub-study accrual.
  - Squamous NSCLC has few highly prevalent driver mutations (unlike
    adenocarcinoma with EGFR, ALK, ROS1, BRAF) — umbrella structure
    less productive.
  - Several sub-studies closed early for futility or toxicity.

  **Methodological observations**:
  - Per-sub-study designs range from classical Phase 2 to
    randomized Phase 3 — Lung-MAP has evolved to allow each
    sub-study to pick the right design.
  - Minimal formal borrowing across sub-studies (Bayesian methods
    applied case-by-case).
  - FDA has accepted Lung-MAP-derived evidence for accelerated
    approvals (S1400A durvalumab in some contexts).

  Comparison with other umbrellas in corpus:
  - **BATTLE / BATTLE-2**: smaller scale, earlier vintage, Bayesian
    adaptive randomization.
  - **NCI-MPACT / NCI-ComboMATCH**: cross-tumor rather than
    single-tumor.
  - **ALCHEMIST**: adjuvant setting, genomic surveillance.
  - **Lung-MAP**: largest, most operationally mature, Phase 2 and
    3 sub-studies in one platform.
