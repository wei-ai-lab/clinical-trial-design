expected:
  sample_size_total: null
  events_total: null
  sample_size_per_substudy: 100
  tolerance:
    sample_size_pct: 20
  notes: |
    **Lung-MAP (SWOG S1400)** is the canonical **molecularly-
    stratified umbrella** for squamous cell lung cancer, initiated
    2014 with FDA / SWOG / NCI partnership. Over 10 sub-studies
    have graduated through the platform since 2014.

    **Design architecture**:
    - Single screening protocol with FoundationOne CDx NGS.
    - Up to 7-10 concurrent sub-studies, each targeting a specific
      molecular alteration or immune biomarker.
    - Each sub-study has its own statistical plan (Phase 2 or
      2/3), primary endpoint, and hypothesis.
    - Patients screened once; if biomarker-positive, assigned to
      matched targeted sub-study; if biomarker-negative, assigned
      to non-matched immunotherapy sub-study.

    **Sub-study highlights** (selected):
    - **S1400A (durvalumab)**: monotherapy arm for non-matched
      patients; ORR ~ 16%.
    - **S1400B (taselisib)**: PI3K pathway; discontinued due to
      toxicity and lack of PFS benefit.
    - **S1400C (palbociclib)**: CDK4/6 pathway; mixed results.
    - **S1400I (nivolumab+ipilimumab vs nivolumab)**: Phase 3
      randomized sub-study; closed 2020 due to futility.
    - **S1800A (ramucirumab+pembrolizumab)**: graduated to a
      larger confirmatory sub-study.

    **Per-sub-study sample-size**:
    - Phase 2 monotherapy: Simon 2-stage, n ≈ 40-60 per biomarker-
      matched cohort.
    - Phase 3 randomized: per standard GS methodology, ~ 200-400
      per arm based on PFS HR target.

    **Accrual dynamics**:
    - ~6000 patients screened as of 2022-2024.
    - ~50-60% biomarker-positive in some analyte bucket.
    - ~30-40% assigned to a sub-study; rest declined or SoC.
    - Retention rate reasonable — but accrual to individual
      biomarker-defined sub-studies slow due to low prevalence.

    **Impact**:
    - Demonstrated feasibility of molecular umbrella in squamous NSCLC.
    - Model for subsequent umbrellas: Precision Promise (pancreatic),
      I-SPY2 (breast), NCI-MATCH (multi-tumor basket, in corpus).
    - Informed FDA guidance on master protocols (FDA 2022 Master
      Protocols guidance).

r_packages:
  - rpact (per-sub-study GS)
  - gsDesign (per-sub-study primary design)
  - clinfun::ph2simon (Phase 2 sub-studies)
  - bhmbasket (borrowing across related biomarker sub-studies,
    where biologically plausible)

