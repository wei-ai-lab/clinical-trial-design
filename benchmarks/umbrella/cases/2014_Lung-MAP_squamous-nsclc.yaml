  indication: "Advanced squamous cell carcinoma of the lung (previously treated, stage IV)"
  population: "Adults with refractory / recurrent squamous NSCLC after platinum chemotherapy; molecularly screened for actionable alterations"
  arms:
    - name: "S1400A: durvalumab (immunotherapy, non-biomarker-matched)"
      allocation: 1
    - name: "S1400B: taselisib (PI3K mutations)"
      allocation: "1 if PIK3CA-mutant"
    - name: "S1400C: palbociclib (CDK4/6 pathway)"
      allocation: "1 if CDK4/6 amplified"
    - name: "S1400D: AZD4547 (FGFR pathway)"
      allocation: "1 if FGFR-amplified/mutated"
    - name: "S1400E: rilotumumab+erlotinib (c-MET pathway)"
      allocation: "1 if MET-positive"
    - name: "S1400G: talazoparib (HR-deficient)"
      allocation: "1 if HR-deficient"
    - name: "S1400I: nivolumab+ipilimumab vs nivolumab monotherapy"
      allocation: 1
  endpoint:
    type: tte
    description: "PFS (primary sub-study endpoint) and OS (secondary / long-term)"
    measurement_time: "continuous follow-up; DCO per sub-study"
  comparison: superiority (each sub-study vs control / comparator)
  sidedness: 1
  alpha: 0.025
  power: 0.80
  effect:
    design_type: "Biomarker-stratified umbrella protocol with per-sub-study Phase 2/3 design"
    screening_platform: "FoundationOne CDx NGS panel for actionable alterations"
    matching_algorithm: "Patient screened → biomarker profile → assigned to matched targeted arm or non-matched immunotherapy arm"
    per_substudy_design: "Each sub-study (S1400A-I) independently designed — Phase 2 or Phase 2/3, various endpoints"
    graduation_criteria: "Sub-study showing promising PFS can advance to Phase 3 with additional patients or combine with external comparator"
