id: 2014_Lung-MAP_squamous-nsclc
family: umbrella
source:
  kind: primary-results
  citation: "Herbst RS, Gandara DR, Hirsch FR, et al. Lung Master Protocol (Lung-MAP)-A Biomarker-Driven Protocol for Accelerating Development of Therapies for Squamous Cell Lung Cancer: SWOG S1400. Clin Cancer Res. 2015 Apr 1;21(7):1514-24. Subsequent sub-study reports: S1400A (durvalumab), S1400B (taselisib), S1400C (palbociclib), S1400D (AZD4547), S1400E (rilotumumab+erlotinib), S1400G (talazoparib), S1400I (nivolumab+ipilimumab vs nivolumab), S1800A (ramucirumab+pembrolizumab), and expansions through 2024."

