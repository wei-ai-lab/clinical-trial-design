id: 02_fixed_binary_non_inferiority
family: fixed-non-inferiority
source:
  citation: "Generic biosimilar NI pattern; methodology textbook"
prompt: |
  We're designing a non-inferiority trial for a biosimilar of a
  reference monoclonal antibody in moderate-to-severe rheumatoid
  arthritis. Primary endpoint is ACR20 response at week 24. The
  reference drug achieves about 70% ACR20; the biosimilar is expected
  to match. NI margin of 12 percentage points (i.e., the biosimilar
  must rule out a worse-than-58% true rate). Use 2.5% one-sided alpha,
  80% power, 1:1 randomization, fixed-sample.
expected:
  tool: design_binary
  parameters:
    p_control: 0.70
    p_treatment: 0.70
    design_class: fixed
    comparison: non-inferiority
    ni_margin: 0.12
    alpha: 0.025
    power: 0.80
    sided: 1
  precedents: ["biosimilar", "ACR20"]
  result_check:
    sample_size_total: { range: [400, 800] }
  interpretation_keys: ["non-inferiority", "margin", "sample size"]
  reasoning_chain:
    must_have_source_types: ["user_supplied"]
  tolerances:
    sample_size_pct: 15
notes: |
  Tests NI handling on binary endpoint. The agent must recognize
  comparison="non-inferiority" and pass ni_margin (not equiv_margin).
